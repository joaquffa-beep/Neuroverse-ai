<style>
/* =====================================================================
   NEUROVERSE 2.0 — SISTEMA DE DISEÑO
   1 Tokens · 2 Base · 3 Layout · 4 Componentes · 5 Dashboard · 6 Mundos
   7 Capa de juego · 8 Juegos · 9 Estadísticas · 10 Logros/Historial
   11 Overlays · 12 Accesibilidad
   Reglas: color intenso solo en lo importante · transform/opacity para
   animar · sin blur en tarjetas repetidas · el juego simplifica la UI.
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

/* ---------- 1 · TOKENS ---------- */
:root{
  /* TEMA NOCHE — NEURAL NIGHT (por defecto) */
  --void:#080D1B;--deep:#111B2E;--deep-2:#1B2940;
  --blue:#6499FF;--violet:#B18BFF;--teal:#46D8CC;--pink:#FF65C7;--ice:#F2F6FF;
  --orange:#FFB547;--green:#5CFF8F;--cosmic:#C58BFF;--cosmic-2:#5E7BFF;
  --purple:var(--violet);--white:var(--ice);--bg:var(--void);--bg-2:var(--deep);--bg-3:var(--deep-2);--c2:var(--c);
  --ok:#3DDC84;--bad:#FF5470;--warn:#FFC24B;
  --text:var(--ice);--muted:#A8B6CE;--dim:#8493AF;
  --line:rgba(120,150,200,.16);--line-2:rgba(130,160,215,.28);--line-3:rgba(170,195,255,.44);
  --panel:rgba(17,27,46,.78);--panel-2:rgba(27,41,64,.6);
  --grad-brand:linear-gradient(120deg,#4A82FF,#8C5DFF 58%,#FF5CC0);
  --grad-cool:linear-gradient(120deg,#4A82FF,#2BD9D2);
  --card-bg:linear-gradient(165deg,rgba(var(--ov),.055),rgba(var(--ov),.012) 62%);
  --ov:255,255,255;--vd:8,13,27;--scrim:3,5,14;--base:#0f1a2e;--modal:#111B2E;--bg-top:#0A1020;--bg-bot:#060A14;
  --stim:#0A1020;--stim-text:#F2F6FF;
  --t-warn:#ffe2a6;--t-bad:#ffb3c0;--t-ok:#b6f5cf;--t-teal:#b9f7f2;--t-soft:#cfd8f5;--t-violet:#dcc8ff;
  --title-grad:linear-gradient(100deg,#fff 5%,#a9c7ff 38%,#cfb0ff 68%,#74f4ec);
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;--s7:3rem;
  --r-xs:8px;--r-sm:12px;--r:18px;--r-lg:24px;--r-xl:32px;
  --sh-1:0 4px 14px -6px rgba(0,0,0,.6);--sh-2:0 20px 46px -20px rgba(0,0,0,.8);
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Oxanium','Space Grotesk',system-ui,sans-serif;
  --t-2xs:.6875rem;--t-xs:.75rem;--t-sm:.8125rem;--t-md:.9375rem;--t-lg:1.0625rem;--t-xl:1.25rem;--t-2xl:1.625rem;--t-3xl:clamp(1.7rem,3.2vw,2.35rem);--t-hero:clamp(2.1rem,4.4vw,3.7rem);
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--d1:.14s;--d2:.26s;--d3:.46s;
  --fs:1;--c:var(--blue);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}

/* ---------- TEMA DÍA — NEURAL DAY (laboratorio científico luminoso) ---------- */
html[data-theme="day"]{
  color-scheme:light;
  --void:#F5F7FC;--deep:#FFFFFF;--deep-2:#EAF0F8;
  --blue:#285ED5;--violet:#7652C6;--teal:#007D78;--pink:#B6317F;--ice:#18253C;
  --orange:#9C5A00;--green:#1B7F45;--cosmic:#7A4FC4;--cosmic-2:#3B58C9;
  --ok:#1B7F45;--bad:#C0243D;--warn:#9A6200;
  --muted:#52647E;--dim:#5A6C85;
  --line:rgba(24,37,60,.12);--line-2:rgba(24,37,60,.2);--line-3:rgba(24,37,60,.34);
  --panel:rgba(255,255,255,.97);--panel-2:#EAF0F8;
  --grad-brand:linear-gradient(120deg,#285ED5,#5B4FD0 58%,#B6317F);
  --grad-cool:linear-gradient(120deg,#285ED5,#007D78);
  --card-bg:linear-gradient(180deg,#FFFFFF,#F7F9FD);
  --sh-1:0 2px 8px -3px rgba(24,37,60,.18);--sh-2:0 14px 34px -18px rgba(24,37,60,.30);
  --ov:24,37,60;--vd:245,247,252;--scrim:24,37,60;--base:#FFFFFF;--modal:#FFFFFF;--bg-top:#F9FAFE;--bg-bot:#EEF2FA;
  --t-warn:#7A4F00;--t-bad:#A3162F;--t-ok:#17673A;--t-teal:#00605C;--t-soft:#3B4C66;--t-violet:#5B3FA8;
  --title-grad:linear-gradient(100deg,#18253C 5%,#285ED5 45%,#7652C6 78%);
}
html[data-theme="day"] body::before{background:
  radial-gradient(1000px 640px at 86% -12%,rgba(118,82,198,.10),transparent 62%),
  radial-gradient(900px 600px at -10% 28%,rgba(40,94,213,.09),transparent 60%),
  radial-gradient(800px 520px at 55% 116%,rgba(0,125,120,.06),transparent 60%),
  linear-gradient(180deg,var(--bg-top),var(--bg-bot))}
html[data-theme="day"] body::after{background-image:linear-gradient(rgba(40,94,213,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(40,94,213,.05) 1px,transparent 1px)}
html[data-theme="day"] ::selection{background:rgba(40,94,213,.28)}
html[data-theme="day"] ::-webkit-scrollbar-thumb{background:rgba(24,37,60,.22)}
html[data-theme="day"] .card::before{background:linear-gradient(150deg,rgba(24,37,60,.16),rgba(40,94,213,.12) 40%,rgba(118,82,198,.08) 70%,rgba(0,125,120,.14))}
html[data-theme="day"] .logo{filter:drop-shadow(0 0 6px rgba(40,94,213,.35))}

/* paneles holográficos: oscuros también en Día (cerebro, mapa de mundos, constelación de logros) */
html[data-theme="day"] :is(.hero-brain,.map-wrap,.astro-wrap,.portal){--text:#F2F6FF;--muted:#A8B6CE;--dim:#8493AF;--blue:#6499FF;--violet:#B18BFF;--teal:#46D8CC;--pink:#FF65C7;--orange:#FFB547;--green:#5CFF8F;--cosmic:#C58BFF;--ok:#3DDC84;--bad:#FF5470;--warn:#FFC24B;--ov:255,255,255;--vd:8,13,27;--line:rgba(120,150,200,.16);--line-2:rgba(130,160,215,.28);--line-3:rgba(170,195,255,.44);color:#F2F6FF;background:radial-gradient(ellipse at 50% 45%,rgba(100,153,255,.22),transparent 70%),#0A1020;border:1px solid rgba(120,150,200,.2)}
html[data-theme="day"] .hero-brain{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-2)}
html[data-theme="day"] .hero-brain .brain-hud{padding:.85rem 1.1rem}
html[data-theme="day"] .hero-brain .brain-cap{padding-bottom:.55rem}
html[data-theme="day"] .dots7 i.on{color:#6E1B49;background:linear-gradient(180deg,rgba(182,49,127,.34),rgba(182,49,127,.14));border-color:rgba(182,49,127,.55);box-shadow:none}
html[data-theme="day"] .wbars i.today{background:linear-gradient(180deg,#86d6d0,var(--teal));box-shadow:0 0 10px rgba(0,125,120,.4)}
html[data-theme="day"] .heat-c.today{outline-color:var(--text)}
html[data-theme="day"] .kbd{color:var(--text);background:rgba(var(--ov),.06)}
html[data-theme="day"] .sw-rule{background:var(--stim)}
html[data-theme="day"] .eyebrow{color:var(--t-teal)}
html[data-theme="day"] .sw-pile:not(.right):not(.wrong){border-color:rgba(24,37,60,.22)}
html[data-theme="day"] .sw-card{box-shadow:0 18px 36px -14px rgba(24,37,60,.45),0 0 0 1px rgba(24,37,60,.2)}
/* superposiciones oscuras con texto claro en cualquier tema */
.lvlup{--text:#F2F6FF;--muted:#A8B6CE;--dim:#8493AF;color:#F2F6FF}
/* alto contraste en Día */
html[data-theme="day"].hc{--line:rgba(24,37,60,.55);--line-2:rgba(24,37,60,.75);--line-3:#18253C;--muted:#2A3A52;--dim:#3B4C66;--panel:#FFFFFF;--card-bg:linear-gradient(#FFFFFF,#FFFFFF)}
html[data-theme="day"].hc p{color:#18253C}
html[data-theme="day"].hc .card{border:1px solid #18253C}
html[data-theme="day"].hc .bar{background:rgba(24,37,60,.2)}
html[data-theme="day"].hc .opt,html[data-theme="day"].hc .seq-cell,html[data-theme="day"].hc .kp-k{border-color:#18253C}
/* MODO FOCUS: interfaz sobria, sin decoración ni animaciones, bordes marcados */
html.focus{--line:rgba(var(--ov),.34);--line-2:rgba(var(--ov),.5);--line-3:rgba(var(--ov),.75)}
html.focus #bgfx,html.focus body::after{display:none}
html.focus body::before{background:var(--void)}
html.focus *,html.focus *::before,html.focus *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.focus .card::before,html.focus .hud>.hud-c,html.focus .hero::after,html.focus .p-bg{display:none!important}
html.focus .glass{backdrop-filter:none;-webkit-backdrop-filter:none}
html.focus .card{border:1px solid var(--line-2);box-shadow:none}

/* ---------- 2 · BASE ---------- */
html{font-size:calc(16px*var(--fs));-webkit-text-size-adjust:100%;color-scheme:dark;scroll-behavior:smooth}
body{background:var(--void);color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:'';position:fixed;inset:0;z-index:-3;background:
  radial-gradient(1000px 640px at 86% -12%,rgba(155,109,255,.2),transparent 62%),
  radial-gradient(900px 600px at -10% 28%,rgba(83,140,255,.15),transparent 60%),
  radial-gradient(800px 520px at 55% 116%,rgba(53,230,223,.08),transparent 60%),
  linear-gradient(180deg,var(--bg-top),var(--void))}
body::after{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(rgba(120,150,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.035) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 75%)}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#fxcv{position:fixed;inset:0;width:100%;height:100%;z-index:150;pointer-events:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:rgba(83,140,255,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(150,175,255,.18);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
.ic{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.fill{fill:currentColor;stroke:none}
h1,h2,h3,h4{line-height:1.15;font-weight:700;letter-spacing:-.005em;font-family:var(--display)}
h1{font-size:var(--t-3xl)}h2{font-size:var(--t-2xl)}h3{font-size:var(--t-xl)}h4{font-size:var(--t-lg);margin-bottom:.4rem}
p{color:var(--muted)}
b,strong{color:var(--text);font-weight:600}
.display{font-family:var(--display);letter-spacing:.06em}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-size:var(--t-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:600}
.eyebrow::before{content:'';width:18px;height:1.5px;background:currentColor;opacity:.7;border-radius:2px}
.eyebrow.nol::before{display:none}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:var(--t-sm)}
.note{font-size:var(--t-xs);color:var(--dim);line-height:1.5}
.divider{height:1px;background:var(--line);margin:1rem 0}
.pill-ok{color:var(--ok)}.pill-bad{color:var(--bad)}.pill-warn{color:var(--warn)}.up{color:var(--ok)}.down{color:var(--bad)}

/* ---------- 3 · LAYOUT ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;padding:1.25rem .9rem;display:flex;flex-direction:column;gap:.25rem;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(var(--vd),.9),rgba(var(--vd),.7));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:10}
.brand{display:flex;align-items:center;gap:.7rem;padding:.2rem .6rem 1.4rem;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.9rem;line-height:1.15}
.brand small{display:block;font-family:var(--font);font-weight:500;letter-spacing:.04em;color:var(--muted);font-size:var(--t-2xs)}
.logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 0 10px rgba(83,140,255,.6))}
.nav-btn{position:relative;display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border-radius:14px;color:var(--muted);background:none;border:0;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:background var(--d2),color var(--d2),transform var(--d1)}
.nav-btn:hover{color:var(--text);background:rgba(var(--ov),.045)}
.nav-btn:active{transform:scale(.98)}
.nav-btn.active{color:var(--text);background:linear-gradient(90deg,rgba(83,140,255,.2),rgba(155,109,255,.04))}
.nav-btn.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--grad-cool);box-shadow:0 0 12px var(--blue)}
.nav-btn.active .ic{color:var(--teal)}
.nav-btn .ic{width:20px;height:20px}
.nav-badge{margin-left:auto;font-size:var(--t-2xs);padding:2px 8px;border-radius:20px;background:rgba(255,101,199,.16);color:var(--pink);font-weight:600}
.pilot{margin-top:auto;padding:.9rem;border-radius:18px;background:linear-gradient(160deg,rgba(var(--ov),.05),rgba(var(--ov),.01));border:1px solid var(--line);font-size:var(--t-sm);display:flex;flex-direction:column;gap:.5rem}
.pilot-top{display:flex;align-items:center;gap:.7rem}
.pilot-top .lvl-mini{position:relative;width:44px;height:44px;flex:none}
.pilot-top .lvl-mini .lv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1rem}
.topbar{display:none}
.bottomnav{display:none}
.main{padding:1.75rem clamp(1rem,3.2vw,2.75rem) 4.5rem;max-width:1320px;width:100%;margin:0 auto;outline:none;min-width:0}
.screen-enter{animation:screenIn .5s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidenav{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;position:sticky;top:0;z-index:25;padding:.55rem 1rem;padding-top:calc(.55rem + var(--safe-t));background:linear-gradient(180deg,rgba(var(--vd),.92),rgba(var(--vd),.7));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;font-size:.8rem}
  .topbar .logo{width:30px;height:30px}
  .tb-chips{display:flex;gap:.4rem;align-items:center}
  .tb-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .65rem;border-radius:99px;background:rgba(var(--ov),.05);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:var(--t-sm)}
  .tb-chip .ic{width:15px;height:15px}
  .topbar .brand{flex:none}
  @media (max-width:520px){.topbar .brand div{display:none}.topbar{gap:.45rem}}
  @media (max-width:360px){.topbar .icon-btn{width:40px;height:40px}.tb-chip{padding:.3rem .5rem}}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:.75rem;right:.75rem;bottom:calc(.65rem + var(--safe-b));z-index:30;padding:.35rem;border-radius:28px;background:rgba(var(--vd),.88);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line-2);box-shadow:0 18px 40px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(var(--ov),.08)}
  .main{padding:1rem 1rem calc(7.5rem + var(--safe-b))}
}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--t-2xs);color:var(--muted);background:none;border:0;padding:.45rem .1rem;border-radius:20px;cursor:pointer;min-height:54px;justify-content:center;position:relative;transition:color var(--d2)}
.bn-btn .ic{width:22px;height:22px;transition:transform var(--d2) var(--spring)}
.bn-btn.active{color:var(--text)}
.bn-btn.active .ic{color:var(--teal);filter:drop-shadow(0 0 7px rgba(53,230,223,.8));transform:translateY(-1px) scale(1.08)}
.bn-btn.active::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.bn-btn.center .bn-orb{width:52px;height:52px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:var(--grad-brand);box-shadow:0 0 0 5px rgba(var(--vd),.9),0 0 26px rgba(120,100,255,.7),inset 0 1px 0 rgba(255,255,255,.4);color:#fff;transition:transform var(--d1)}
.bn-btn.center:active .bn-orb{transform:scale(.92)}
.bn-btn.center.active .ic,.bn-btn.center .ic{color:#fff;filter:none;transform:none}
.bn-btn.center::after{display:none}

/* ---------- 4 · COMPONENTES ---------- */
.card{position:relative;background:var(--card-bg),var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-2),inset 0 1px 0 rgba(var(--ov),.06)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(150deg,rgba(var(--ov),.2),rgba(83,140,255,.1) 32%,rgba(155,109,255,.05) 62%,rgba(53,230,223,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.hud>.hud-c{position:absolute;inset:10px;pointer-events:none;opacity:.5;background:
  linear-gradient(var(--c),var(--c)) 0 0/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1.5px 14px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 14px no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 14px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 14px no-repeat}
.pad{padding:1.25rem}.pad-lg{padding:1.6rem}
.stack{display:flex;flex-direction:column;gap:.9rem}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem}

/* botón protagonista */
.btn-mission{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:.9rem;min-height:66px;padding:.55rem 1.7rem .55rem .6rem;border:0;border-radius:22px;color:#fff;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:1rem;text-align:left;cursor:pointer;background:linear-gradient(110deg,#3F78FF,#8A5CFF 56%,#FF5CC0);box-shadow:0 16px 44px -12px rgba(120,100,255,.85),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 22px rgba(0,0,0,.2);transition:transform var(--d1) var(--ease),box-shadow var(--d2),filter var(--d2)}
.btn-mission .bm-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(var(--vd),.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}

.btn-mission::before{content:'';position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-20deg);animation:sheen 5s ease-in-out infinite;z-index:-1}

.icon-btn{position:relative;overflow:hidden;width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:rgba(var(--ov),.04);cursor:pointer;color:var(--text);flex:none;transition:background var(--d2),transform var(--d1)}

.seg{display:flex;flex-wrap:wrap;gap:.5rem}

.bar>i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,transparent,rgba(var(--ov),.55));border-radius:inherit}
.ring{display:block}

.field{display:flex;flex-direction:column;gap:.4rem}

.input{width:100%;min-height:50px;padding:.7rem .95rem;border-radius:14px;border:1px solid var(--line-2);background:rgba(var(--vd),.62);color:var(--text);font-size:16px;outline:none;transition:border-color var(--d2),box-shadow var(--d2)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(83,140,255,.25)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}

.switch{position:relative;width:52px;height:30px;flex:none}

.spark{display:block;width:100%;height:46px}

/* cuenta y sincronización: punto de estado */
:is(.acct-dot,#tb-acct)[data-st=ok]{--dot:var(--ok)}

const bar=(v,color)=>`<div class="bar" style="--c:${color||'var(--teal)'}"><i style="width:0" data-w="${(clamp(v||0,0,1)*100).toFixed(1)}%"></i></div>`;
function animateIn(root=document){const go=()=>{$$('.rv[data-off]',root).forEach(e=>{e.style.strokeDashoffset=e.dataset.off});$$('.bar>i[data-w]',root).forEach(e=>{e.style.width=e.dataset.w});$$('.wbars i[data-h]',root).forEach(e=>{e.style.setProperty('--h',e.dataset.h)})};requestAnimationFrame(()=>requestAnimationFrame(go));setTimeout(go,450)}

function deepFill(t,d){for(const k in d){if(t[k]===undefined||t[k]===null&&d[k]!==null)t[k]=d[k];else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))deepFill(t[k],d[k])}return t}
function migrate(st){/* v1 es la versión inicial: punto de extensión para futuras migraciones */st.version=VERSION;return st}
function load(){
  try{const t='__nv_test';localStorage.setItem(t,'1');localStorage.removeItem(t)}catch(e){storageOK=false}
  try{const raw=storageOK&&localStorage.getItem(KEY);const p=raw?JSON.parse(raw):null;S=p&&p.app==='neuroverse-ai'?migrate(deepFill(p,defaults())):defaults()}catch(e){console.warn(e);S=defaults()}
}
let saveT=null;
function save(now){clearTimeout(saveT);const go=()=>{if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false;toast('<b>No se pudo guardar</b><small>El almacenamiento del navegador está lleno o bloqueado.</small>',{icon:'info',color:'var(--bad)'});return}try{Cloud.touch()}catch(e){console.warn('[cloud]',e)}};if(now)go();else saveT=setTimeout(go,200)}
addEventListener('pagehide',()=>save(true));
addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});

function modal({title,body,actions=[{label:'Cerrar',cls:'btn-primary'}],onClose,wide}){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="card modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,''))}" ${wide?'style="max-width:680px"':''}><h3>${title}</h3><div class="m-body">${body}</div><div class="m-actions"></div></div>`;
  const acts=bg.querySelector('.m-actions'),prev=document.activeElement;let closed=false;
  const close=()=>{if(closed)return;closed=true;bg.remove();document.removeEventListener('keydown',onKey,true);onClose?.();prev?.focus?.()};
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=()=>{if(a.fn&&a.fn(bg)===false)return;close()};acts.appendChild(b)});
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
  document.addEventListener('keydown',onKey,true);
  bg.addEventListener('click',e=>{if(e.target===bg)close()});
  $('#overlay-root').appendChild(bg);
  setTimeout(()=>(bg.querySelector('input')||acts.querySelector('.btn-primary,.btn-danger')||acts.lastChild)?.focus({preventScroll:true}),30);
  return {close,el:bg};
}

function lvlCalc(xp,base,inc){let L=1,need=base;xp=Math.max(0,xp|0);while(xp>=need){xp-=need;L++;need=base+inc*(L-1)}return {level:L,into:xp,need,pct:xp/need}}

function streak(){
  const keys=Object.keys(S.days).filter(k=>S.days[k].acts>0).sort();
  if(!keys.length)return {current:0,best:0,total:0,trainedToday:false,last:null};
  let best=1,run=1;
  for(let i=1;i<keys.length;i++){const g=daysBetween(keys[i-1],keys[i]);run=g<=2?run+1:1;best=Math.max(best,run)}
  const t=today(),gap=daysBetween(keys.at(-1),t);
  return {current:gap<=2?run:0,best,total:keys.length,trainedToday:keys.at(-1)===t,last:keys.at(-1),atRisk:gap===2}
}

function logAdapt(game,dir,level,why){S.adaptLog.push({ts:Date.now(),game,dir,level,why});if(S.adaptLog.length>120)S.adaptLog.shift()}
/* Controlador de dificultad (uno por juego, con su propio nivel y su propio historial).
   Mira la precisión de las últimas rondas, su estabilidad (desviación), las falsas alarmas y las omisiones si el juego las reporta.
   Solo mueve UNA variable (el nivel, ±1) y solo con partidas jugadas en el nivel recomendado. El jugador puede ignorarlo y elegir cualquier nivel. */
function adaptAfter(gid,level,acc,info,res){
  const d=GAMES[gid],g=gs(gid),up=d.adapt?.up??.85,down=d.adapt?.down??.55,max=d.maxLevel,ex=(res&&res.extra)||{};
  if(info.anomaly)return {dir:null,text:`Desafío sorpresa jugado en el nivel ${level}: no modifica tu nivel recomendado (${g.level}).`};
  if(info.partial)return {dir:null,text:'Partida interrumpida: no se usa para ajustar la dificultad.'};
  if(level!==g.level)return {dir:null,text:`Elegiste el nivel ${level} manualmente. Neuro AI solo ajusta tu nivel recomendado (${g.level}) con las partidas jugadas en ese nivel.`};
  g.recent.push(+acc.toFixed(3));if(g.recent.length>6)g.recent.shift();
  const r=g.recent,l3=r.slice(-3),m3=l3.length?avg(l3):0,sd=l3.length>1?Math.sqrt(avg(l3.map(a=>(a-m3)**2))):0;
  const fa=typeof ex.faRate==='number'?ex.faRate:null,om=typeof ex.omRate==='number'?ex.omRate:null;
  const noisy=(fa!=null&&fa>.25)||(om!=null&&om>.25);
  if(r.length>=3&&l3.every(a=>a>=up)){
    if(sd>.09||noisy){const why=noisy?`había ${fa!=null&&fa>.25?`muchas falsas alarmas (${pct(fa)})`:`muchas omisiones (${pct(om)})`}`:`el rendimiento fue irregular entre rondas (± ${Math.round(sd*100)} puntos)`;return {dir:null,text:`Precisión alta en las últimas 3 rondas, pero ${why}. Espero una ronda más estable antes de subir el nivel ${level}.`}}
    if(g.level<max){g.level++;g.recent=[];logAdapt(gid,'up',g.level,`3 rondas seguidas con ≥ ${pct(up)} y rendimiento estable`);return {dir:'up',text:`3 rondas seguidas con precisión ≥ ${pct(up)} y un rendimiento estable en el nivel ${level}. Subo tu nivel recomendado a <b>${g.level}</b>; tú puedes elegir otro cuando quieras.`}}
    return {dir:null,text:`Dominas el nivel máximo (${max}) con constancia. ¡Impresionante!`}}
  const veryLow=acc<.35||(fa!=null&&fa>=.5);
  if((r.length>=2&&r.slice(-2).every(a=>a<down))||(veryLow&&r.length>=2&&r[r.length-2]<up)){
    if(g.level>1){g.level--;g.recent=[];logAdapt(gid,'down',g.level,veryLow?'ronda con rendimiento muy bajo':`2 rondas con &lt; ${pct(down)}`);return {dir:'down',text:`${veryLow?'Rendimiento muy bajo en esta ronda tras otra complicada':`2 rondas seguidas con precisión &lt; ${pct(down)}`}. Bajo un nivel (al <b>${g.level}</b>) para que consolides: volverás a subir cuando lo domines.`}}
    return {dir:null,text:'Estás en el nivel inicial. Tómate tu tiempo: aquí la precisión importa más que la velocidad.'}}
  let k=0;for(let i=r.length-1;i>=0&&r[i]>=up;i--)k++;
  if(acc>=up)return {dir:null,text:`Precisión alta (${pct(acc)}). Llevas ${k} de 3 rondas ≥ ${pct(up)} para subir de nivel (también miro que sean estables).`};
  if(acc<down)return {dir:null,text:`Precisión baja (${pct(acc)}). Si se repite en la próxima ronda bajaré un nivel para que consolides.`};
  return {dir:null,text:`Precisión de ${pct(acc)}, entre los umbrales (${pct(down)}–${pct(up)}). Mantengo el nivel ${g.level} y varío los retos.`}
}
function recordResult(gid,r,info){
  const d=GAMES[gid],g=gs(gid),date=today(),acc=clamp(+r.acc||0,0,1);
  const gB=globalLvl(),sB=skillLvl(d.skill),before=gB.level,sBefore=sB.level;
  const parts=[['Participación',10],['Precisión',Math.round(30*acc)],['Dificultad',2*(info.level-1)]];
  if(acc>=.999&&r.total>=5)parts.push(['Ronda perfecta',10]);
  let xp=sum(parts.map(p=>p[1]));
  if(info.partial){const h=Math.round(xp/2);parts.push(['Interrumpida −50 %',-(xp-h)]);xp=h}
  if(info.anomaly){parts.push(['Anomalía ×2',xp]);xp*=2}
  const prevEq=[...S.results].reverse().find(x=>x.game===gid&&x.mode===(info.mode||'std')&&x.level===info.level);
  const mk=info.mode||'std',best=g.best[mk]||(g.best[mk]={}),pbs=[];
  const better=d.metric?.better==='low'?(a,b)=>a<b:(a,b)=>a>b;
  if(!info.partial){
    if(r.score!=null){if(best.score==null){best.score=r.score;best.lv=info.level}else if(better(r.score,best.score)){pbs.push({k:'score',label:d.metric.label,prev:best.score,val:r.score});best.score=r.score;best.lv=info.level}}
    if(d.speed&&r.rt&&acc>=.8){if(best.rt==null)best.rt=Math.round(r.rt);else if(r.rt<best.rt){pbs.push({k:'rt',label:'Tiempo medio de respuesta',prev:best.rt,val:Math.round(r.rt)});best.rt=Math.round(r.rt)}}
    if(r.total>=5){if(best.acc==null)best.acc=acc;else if(acc>best.acc+.0001){pbs.push({k:'acc',label:'Precisión',prev:best.acc,val:acc});best.acc=acc}}
  }
  const res={id:uid(),game:gid,skill:d.skill,ts:Date.now(),date,dur:Math.max(1,Math.round(info.durSec)),level:info.level,mode:mk,acc:+acc.toFixed(4),score:r.score??null,correct:r.correct||0,wrong:r.wrong||0,total:r.total||0,rt:r.rt?Math.round(r.rt):null,xp,daily:!!info.daily,session:info.session||null,anomaly:!!info.anomaly,extra:{...(r.extra||{}),...(info.partial?{partial:true}:{})},pb:pbs.map(p=>p.k),pbd:pbs,opts:info.opts||{}};
  const adapt=adaptAfter(gid,info.level,acc,info,r);res.adapt=adapt.dir;
  const lvh=g.lv||(g.lv={}),lh=lvh[info.level]||(lvh[info.level]={n:0,accSum:0,best:0,last:0});if(!info.partial){lh.n++;lh.accSum=+(lh.accSum+acc).toFixed(4);lh.best=Math.max(lh.best,+acc.toFixed(4));lh.last=Date.now()}
  S.results.push(res);if(S.results.length>4000)S.results.splice(0,S.results.length-4000);
  g.plays++;g.sec+=res.dur;g.last=res.ts;g.lastMode=info.mode;g.lastOpts=info.opts||{};
  S.xp+=xp;S.skillXp[d.skill]=(S.skillXp[d.skill]||0)+xp;
  const day=S.days[date]||(S.days[date]={sec:0,acts:0,xp:0,accSum:0});day.sec+=res.dur;day.acts++;day.xp+=xp;day.accSum+=acc;
  S.stats.totalSec+=res.dur;S.stats.activities++;
  if(info.anomaly)S.anomalies[date]=res.id;
  const mission=checkMission();
  const newAch=checkAch(res);
  const after=globalLvl().level,sAfter=skillLvl(d.skill).level;
  UI.pendingWave=d.skill;
  logLevels(before,after,d.skill,sBefore,sAfter);
  save();
  return {res,xp,parts,pbs,adapt,prevEq,before:{g:gB,s:sB},levelUp:after>before?after:null,skillUp:sAfter>sBefore?{skill:d.skill,level:sAfter}:null,newAch,mission}
}

function coachTips(){
  const tips=[],R=S.results,now=Date.now(),name=S.profile.name?`, ${esc(S.profile.name)}`:'';
  if(!R.length){tips.push({ic:'brain',c:'#35E6DF',text:`¡Hola${name}! Soy <b>Neuro AI</b>, tu entrenador local. Aún no tengo datos tuyos: completa tu primera misión o explora un mundo y empezaré a adaptar el entrenamiento a tus resultados reales.`,act:{label:'Empezar misión de hoy',go:'daily'}});return tips}
  const lastDay=R.at(-1).date,since=daysBetween(lastDay,today());

  const wk=now-7*864e5,secBy=Object.fromEntries(SKILLS.map(s=>[s.id,0]));R.filter(r=>r.ts>=wk).forEach(r=>secBy[r.skill]+=r.dur);
  const tot=sum(Object.values(secBy)),mean=tot/7,minS=SKILLS.slice().sort((a,b)=>secBy[a.id]-secBy[b.id]||lastPlayed(a.id)-lastPlayed(b.id))[0];
  if(tot>0&&secBy[minS.id]<mean*.6)tips.push({ic:minS.icon,c:minS.color,text:`Esta semana practicaste menos <b>${minS.short.toLowerCase()}</b> (${fmtMin(secBy[minS.id])}, frente a ${fmtMin(mean)} de media por área). Te recomiendo comenzar por <b>${minS.world}</b>.`,act:{label:`Ir a ${minS.world}`,world:minS.id}});
  const lastPB=R.slice(-10).reverse().find(r=>r.pb&&r.pb.length&&now-r.ts<3*864e5);
  if(lastPB)tips.push({ic:'trophy',c:'#FFB547',text:`Superaste tu mejor marca en <b>${GAMES[lastPB.game].name}</b>: ${pbText(lastPB)}.`});
  const byG={};R.slice(-40).forEach(r=>(byG[r.game]||(byG[r.game]=[])).push(r));
  for(const[gid,arr]of Object.entries(byG)){const l2=arr.slice(-2);if(l2.length===2&&l2.every(r=>r.acc<.55)&&now-l2[1].ts<2*864e5){tips.push({ic:'shield',c:'#FF5470',text:`Has cometido más errores en las últimas rondas de <b>${GAMES[gid].name}</b> (${l2.map(r=>pct(r.acc)).join(' y ')}). ${l2[1].adapt==='down'?'Ya bajé un nivel':'Te propongo bajar un nivel'} para priorizar la precisión.`,act:{label:'Practicar con calma',play:gid}});break}}
  for(const[gid,arr0]of Object.entries(byG)){const l=arr0.at(-1),arr=R.filter(r=>r.game===gid&&r.mode===l.mode&&r.level===l.level);if(arr.length>=6){const a=avg(arr.slice(-3).map(r=>r.acc)),b=avg(arr.slice(-6,-3).map(r=>r.acc));if(a-b>=.06){tips.push({ic:'trend',c:'#3DDC84',text:`Tu precisión en <b>${GAMES[gid].name}</b> (nivel ${l.level}) pasó de ${pct(b)} a ${pct(a)} en tus 3 últimas partidas comparables. ¡Progreso real!`});break}}}
  const up=S.adaptLog.slice().reverse().find(e=>e.dir==='up'&&now-e.ts<3*864e5);
  if(up&&GAMES[up.game])tips.push({ic:'bolt',c:'#538CFF',text:`Desbloqueaste el nivel <b>${up.level}</b> en ${GAMES[up.game].name} (${up.why}).`});
  const goal=GOALS[S.profile.goal];
  if(goal&&goal.skills.length){const sk=SK[goal.skills[0]];if(!R.some(r=>r.date===today()&&r.skill===sk.id))tips.push({ic:goal.icon,c:goal.c,text:`Tu objetivo es <b>${goal.name.toLowerCase()}</b> y hoy aún no has entrenado ${sk.short.toLowerCase()}.`,act:{label:`Abrir ${sk.world}`,world:sk.id}})}
  const st=streak();if(since<2&&st.current>=2)tips.push({ic:'flame',c:'#FF65C7',text:`Racha de <b>${st.current} días</b>. ${st.trainedToday?'Hoy ya entrenaste: ¡bien hecho!':'Entrena hoy para mantenerla encendida.'}`});
  if(!tips.length)tips.push({ic:'brain',c:'#35E6DF',text:'Tu rendimiento es estable en todas las áreas. Mantén la variedad: la misión de hoy combina habilidades distintas.',act:{label:'Ver misión de hoy',go:'daily'}});
  return tips.slice(0,4)
}

/* ---------- Contadores animados (la cifra final es siempre la real) ---------- */
function countUp(root=document){
  $$('[data-count]',root).forEach(el=>{
    const to=+el.dataset.count,dec=+(el.dataset.dec||0),dur=+(el.dataset.dur||950);
    const fmt=v=>dec?v.toFixed(dec).replace('.',','):Math.round(v).toLocaleString('es');
    el.textContent=fmt(to);
    if(RM()||!isFinite(to)||Math.abs(to)<2)return;
    const t0=performance.now();let fin=false;
    const step=t=>{if(fin||!el.isConnected)return;const p=Math.min(1,(t-t0)/dur);el.textContent=fmt(to*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(step)};
    el.textContent=fmt(0);requestAnimationFrame(step);
    setTimeout(()=>{fin=true;el.textContent=fmt(to)},dur+250);
  });
}

const Transition={busy:false,

  for(let i=0;i<ps.length;i++){const p=ps[i],a=p.a*(.7+.3*Math.sin(t*p.tw+p.ph));c.fillStyle=`rgba(${day?p.dcol:p.col},${(day?a*.55:a).toFixed(3)})`;c.beginPath();c.arc(pos[i][0],pos[i][1],p.r,0,7);c.fill()}

/* ---------- Cerebro holográfico v2 ----------
   Proyección 3D propia en canvas 2D: respira, gira, responde al puntero y
   al arrastre, lanza pulsos por las conexiones y gana órbitas según tu
   nivel. Es una representación simbólica del progreso, no una medición. */
class Brain{
  constructor(cv,{nodes=360,compact=false,interactive=true,onPick=null}={}){
    this.cv=cv;this.c=cv.getContext('2d');this.N=nodes;this.compact=compact;this.onPick=onPick;
    this.rot=.6;this.vrot=0;this.tx=0;this.ty=0;this.px=0;this.py=0;this.drag=null;
    this.waves=[];this.pulses=[];this.alive=true;this.levels={};this.active=nodes;this.tier=0;this.boost=0;this.spr={};this.visible=true;this.lastDraw=0;
    this.gen();this.resize();
    this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(cv);
    if('IntersectionObserver'in window){this.io=new IntersectionObserver(e=>{this.visible=e[0].isIntersecting});this.io.observe(cv)}
    if(interactive)this.bind();
    this.loop();
  }
  surf(s,u,v,rr=1){
    const dx=Math.sin(u)*Math.cos(v),dy=Math.cos(u),dz=Math.sin(u)*Math.sin(v),w=1+.06*Math.sin(v*7+u*3)*Math.sin(u*5);
    let x=s*.25+dx*.41*rr*w,y=dy*.6*rr*w,z=dz*1.0*rr*w;
    if(x*s<.05)return null;
    if(y<-.26)y=-.26+(y+.26)*.5;
    return {x,y,z};
  }
  skillAt(x,y,z){if(y<-.3)return 'motor';if(z>.42)return x<0?'logic':'attention';if(z<-.42)return 'learning';if(y>.08)return 'math';return x<0?'language':'memory'}
  gen(){
    const r=mulberry(1234),pts=[];
    const add=(p,sk)=>{pts.push({x:p.x,y:p.y,z:p.z,sk:sk||this.skillAt(p.x,p.y,p.z),fl:0})};
    const nCortex=Math.round(this.N*.82);
    while(pts.length<nCortex){
      const s=r()<.5?-1:1,p=this.surf(s,Math.acos(2*r()-1),r()*Math.PI*2,.9+r()*.1);
      if(p)add(p)
    }
    /* cerebelo y tronco */
    while(pts.length<this.N){
      const th=r()*Math.PI*2,ph=Math.acos(2*r()-1),rr=.88+r()*.12;
      if(r()<.78)add({x:Math.sin(ph)*Math.cos(th)*.36*rr,y:-.46+Math.cos(ph)*.17*rr,z:-.64+Math.sin(ph)*Math.sin(th)*.27*rr},'motor');
      else add({x:(r()-.5)*.14,y:-.58-r()*.38,z:-.18+(r()-.5)*.1},'motor')
    }
    pts.forEach(p=>{p.col=SK[p.sk].color;p.rgb=hexRgb(p.col)});
    const r2=mulberry(77),order=pts.map((_,i)=>[r2(),i]).sort((a,b)=>a[0]-b[0]);order.forEach(([,idx],k)=>pts[idx].rank=k);
    const E=[],seen=new Set(),adj=pts.map(()=>[]);
    pts.forEach((a,i)=>{const near=pts.map((b,j)=>[j,(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2]).filter(q=>q[0]!==i&&q[1]<.09).sort((p,q)=>p[1]-q[1]).slice(0,3);near.forEach(([j])=>{const k=i<j?i+'-'+j:j+'-'+i;if(!seen.has(k)){seen.add(k);E.push({a:i,b:j,rgb:a.rgb});adj[i].push(j);adj[j].push(i)}})});
    this.nodes=pts;this.edges=E;this.adj=adj;
    /* circunvoluciones: curvas sinuosas sobre la superficie de cada hemisferio */
    const F=[];
    for(const s of [-1,1])for(let k=0;k<11;k++){
      const v0=r()*Math.PI*2,u0=.55+r()*2,seg=[];let cur=[];
      for(let i=0;i<=40;i++){const t=i/40,u=clamp(u0+Math.sin(t*5.2+k*1.7)*.3,.3,2.85),p=this.surf(s,u,v0+t*2.4,1.0);if(p)cur.push(p);else if(cur.length){seg.push(cur);cur=[]}}
      if(cur.length)seg.push(cur);
      seg.filter(q=>q.length>3).forEach(q=>{const m=q[q.length>>1];F.push({pts:q,rgb:hexRgb(SK[this.skillAt(m.x,m.y,m.z)].color)})})
    }
    this.folds=F;
    this.cent={};SKILLS.forEach(s=>{const ns=pts.filter(p=>p.sk===s.id);this.cent[s.id]={x:avg(ns.map(n=>n.x)),y:avg(ns.map(n=>n.y)),z:avg(ns.map(n=>n.z))}})
  }  setData(levels,acts,gLevel=1){this.levels=levels||{};this.active=clamp(70+acts*5,70,this.N);this.tier=clamp(Math.floor(gLevel/3),0,4)}
  wave(sk){if(RM())return;const o=sk&&this.cent[sk]?this.cent[sk]:{x:0,y:0,z:0};this.waves.push({o,t:performance.now()})}

function lexHas(set,word){const w=loose(word);if(!w)return false;for(const v of wordVariants(w))if(set.has(v))return true;return false}

 init(){

    if(Play.isOpen()){try{history.pushState({s:UI.cur,p:UI.params},'')}catch(_){}if(!$('.modal-bg')&&!$('.lvlup'))Play.quit();return}

  });

  const bpOf=()=>innerWidth<640?0:innerWidth<=900?1:2;let bp=bpOf(),rt=null;
  addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const n=bpOf();if(n!==bp){bp=n;if(!Play.isOpen()&&!$('#onb')&&!$('.tour-hole'))UI.render()}},300)});

    const t=e.target.closest('[data-go],[data-play],[data-world],[data-daily],[data-skill],[data-start]');if(!t||t.disabled)return;

  const circ=circuit&&circuit!=='balanced'?circuit:'',key=`${today()}|${minutes}|${S.today.variant}|${(skills||[]).join(',')}|${S.settings.noSpeed?1:0}|${S.profile.goal}|${circ}`;

  return S.today.plan
}

/* ---------- ESTADÍSTICAS · CENTRO DE INTELIGENCIA ---------- */
function radarSVG(){const compact=innerWidth<640;
  const cx=230,cy=215,R=145,n=SKILLS.length,pts=SKILLS.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return {s,a,v:skillPerf(s.id)}});
  const P=(a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r];
  let o=`<svg class="chart" viewBox="0 0 460 440" role="img" aria-label="Radar de rendimiento por habilidad"><defs><radialGradient id="rdg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9B6DFF" stop-opacity=".5"/><stop offset="1" stop-color="#538CFF" stop-opacity=".12"/></radialGradient></defs>`;
  [25,50,75,100].forEach(k=>{o+=`<polygon points="${pts.map(p=>P(p.a,R*k/100).join(',')).join(' ')}" fill="none" stroke="rgba(150,175,255,${k===100?.28:.12})"/>`});
  pts.forEach(p=>{const[x,y]=P(p.a,R);o+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(150,175,255,.15)"/>`});
  if(pts.some(p=>p.v!=null))o+=`<g class="rpoly"><polygon class="glow" style="color:#538CFF" points="${pts.map(p=>P(p.a,R*(p.v||0)/100).join(',')).join(' ')}" fill="url(#rdg)" stroke="#6F9BFF" stroke-width="2.2" stroke-linejoin="round"/></g>`;
  pts.forEach(p=>{const[lx,ly]=P(p.a,R+34),anchor=Math.abs(Math.cos(p.a))<.2?'middle':Math.cos(p.a)>0?'start':'end',rs=S.results.filter(r=>r.skill===p.s.id);

function vaultData(){const out=[];for(const g of Object.keys(GAMES)){const d=GAMES[g],rs=S.results.filter(r=>r.game===g&&!(r.extra&&r.extra.partial));if(!rs.length)continue;const by={};rs.forEach(r=>(by[r.mode]=by[r.mode]||[]).push(r));
  for(const [m,arr] of Object.entries(by)){const better=d.metric?.better==='low'?(a,b)=>a<b:(a,b)=>a>b,sc=arr.filter(r=>r.score!=null),bs=sc.reduce((b,r)=>!b||better(r.score,b.score)?r:b,null),ba=arr.filter(r=>r.total>=5).reduce((b,r)=>!b||r.acc>b.acc?r:b,null);out.push({g,m,n:arr.length,bs,ba,skill:d.skill})}}return out}

SCREENS.studio={title:'Sound Studio',
 html(){const on=Sound.on(),s=S.settings;
  return `<div class="sec-h"><div><div class="eyebrow">Laboratorio</div>${labBack}<h1>SOUND STUDIO</h1><p>Un estudio para tocar con los instrumentos del juego, practicar con metrónomo y grabar una melodía. Nada se envía a ningún sitio.</p></div></div>
  ${on?'':`<div class="banner-warn">El sonido está desactivado. <button class="btn btn-sm" id="sd-on" type="button">Activar sonido</button></div>`}
  <div class="g-main"><div class="stack">
   <div class="card pad-lg"><h3>Teclado</h3><div class="field" style="margin:.6rem 0"><label for="sd-inst">Instrumento</label><select class="input" id="sd-inst">${Object.entries(INST_N).map(([k,n])=>`<option value="${k}" ${(s.inst||'piano')===k?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="rh-kb" data-stim id="sd-kb">${SCALE_N.map((nm,i)=>`<button class="rh-key" data-k="${i}" aria-label="${nm}"><span class="kbd">${i+1}</span><b>${nm}${i===7?'’':''}</b></button>`).join('')}</div>
    <p class="note" style="margin-top:.5rem">Teclas 1–8 del teclado. Escala de Do mayor (Do4–Do5).</p></div>
   <div class="card pad-lg"><h3>Grabadora</h3><div class="row" style="margin:.6rem 0"><button class="btn" id="sd-rec" type="button">● Grabar</button><button class="btn" id="sd-play" type="button" disabled>▶ Reproducir</button><button class="btn btn-ghost" id="sd-clr" type="button" disabled>Borrar</button></div><div class="small muted" id="sd-info" aria-live="polite">Sin grabación.</div></div>
  </div><div class="stack">
   <div class="card pad-lg"><h3>Metrónomo</h3><div class="field" style="margin:.6rem 0"><label for="sd-bpm">Tempo: <b id="sd-bpmv">100</b> pulsaciones por minuto</label><input type="range" id="sd-bpm" min="40" max="200" step="1" value="100"></div><div class="beat-row" id="sd-beats"><i></i><i></i><i></i><i></i></div><div class="row" style="margin-top:.6rem"><button class="btn btn-primary" id="sd-metro" type="button">▶ Iniciar</button></div></div>
   <div class="card pad-lg"><h3>Mezcla</h3><div class="field" style="margin:.6rem 0"><label for="sd-vol">Instrumentos y metrónomo</label><input type="range" id="sd-vol" min="0" max="1" step=".05" value="${s.gameVol??1}"></div><div class="row"><button class="btn" id="sd-amb" type="button">Probar música ambiental</button></div><p class="note" style="margin-top:.5rem">Los volúmenes del resto de canales están en Configuración.</p></div>
  </div></div>`},
 mount(m){
  const s=S.settings,st=UI.sd={bpm:100,metro:false,rec:false,take:[],t0:0,timer:null,nextT:0,beat:0,playing:false},alive=()=>UI.cur==='studio';
  const keys=$$('.rh-key',m),lit=k=>{keys[k].classList.add('lit');setTimeout(()=>keys[k].classList.remove('lit'),180)};
  const note=k=>{Sound.inst(s.inst||'piano',SCALE[k],.4,.3,0,true);lit(k);if(st.rec)st.take.push({k,t:performance.now()-st.t0});info()};
  const info=()=>{const n=st.take.length,dur=n?Math.round(st.take.at(-1).t/100)/10:0;$('#sd-info').textContent=st.rec?`Grabando… ${n} nota${n===1?'':'s'}`:n?`${n} nota${n===1?'':'s'} · ${dur} s`:'Sin grabación.';$('#sd-play').disabled=st.rec||!n||st.playing;$('#sd-clr').disabled=st.rec||!n};
  $('#sd-on')?.addEventListener('click',()=>{s.sound=true;if(s.volume<=0)s.volume=.55;save();Sound.init();Sound.setVol();UI.render()});
  $('#sd-inst').onchange=e=>{s.inst=e.target.value;save();[0,2,4,7].forEach((k,i)=>Sound.inst(s.inst,SCALE[k],.28,.3,i*.2,true))};
  $('#sd-kb').addEventListener('pointerdown',e=>{const b=e.target.closest('.rh-key');if(b){e.preventDefault();note(+b.dataset.k)}});
  const onKey=e=>{if(!alive()){document.removeEventListener('keydown',onKey);stopMetro();return}if(e.target.closest&&e.target.closest('input,select,textarea'))return;if(/^[1-8]$/.test(e.key)&&!e.repeat){e.preventDefault();note(+e.key-1)}};document.addEventListener('keydown',onKey);
  $('#sd-rec').onclick=()=>{if(st.rec){st.rec=false;$('#sd-rec').textContent='● Grabar'}else{st.rec=true;st.take=[];st.t0=performance.now();$('#sd-rec').textContent='■ Parar'}info()};
  $('#sd-play').onclick=()=>{if(!st.take.length||st.playing)return;st.playing=true;info();const t0=st.take[0].t;st.take.forEach(n=>{Sound.inst(s.inst||'piano',SCALE[n.k],.4,.3,(n.t-t0)/1000+.05,true);setTimeout(()=>lit(n.k),(n.t-t0)+50)});setTimeout(()=>{st.playing=false;if(alive())info()},st.take.at(-1).t-t0+700)};
  $('#sd-clr').onclick=()=>{st.take=[];info()};
  /* metrónomo con planificación anticipada sobre el reloj del audio: no depende de la exactitud de setTimeout */
  const beatsEl=$$('#sd-beats i',m);
  function pump(){if(!alive()||!st.metro){return stopMetro()}const c=Sound.ctx;while(st.nextT<c.currentTime+.12){const when=Math.max(0,st.nextT-c.currentTime),b=st.beat%4;Sound.drum('click',when,.5,b===0,true);setTimeout(()=>{if(alive())beatsEl.forEach((el,i)=>el.classList.toggle('on',i===b))},when*1000);st.nextT+=60/st.bpm;st.beat++}}
  function stopMetro(){st.metro=false;clearInterval(st.timer);st.timer=null;const b=$('#sd-metro');if(b)b.textContent='▶ Iniciar';beatsEl.forEach(el=>el.classList.remove('on'))}
  $('#sd-metro').onclick=()=>{if(st.metro)return stopMetro();if(!Sound.init())return;if(Sound.ctx.state==='suspended')Sound.ctx.resume();st.metro=true;st.beat=0;st.nextT=Sound.ctx.currentTime+.08;$('#sd-metro').textContent='■ Detener';pump();st.timer=setInterval(pump,25)};

/* ---- Neural Galaxy ---- */
function gxLayout(W,H){
 const R=seeded('galaxy-v1'),m=Math.min(W,H),cx=W/2,cy=H/2,out=[],centers={};
 SKILLS.forEach((s,i)=>{const a=-Math.PI/2+i/SKILLS.length*Math.PI*2;centers[s.id]={x:cx+Math.cos(a)*m*.3*(W/H>1.2?W/H*.75:1),y:cy+Math.sin(a)*m*.3,a}});
 SKILLS.forEach(s=>{const c=centers[s.id],gl=s.games.filter(g=>GAMES[g]);gl.forEach((g,j)=>{const ang=j/gl.length*Math.PI*2+R()*.6,rad=m*(.08+R()*.075);out.push({g,sk:s.id,col:s.color,x:c.x+Math.cos(ang)*rad,y:c.y+Math.sin(ang)*rad})})});
 const pad=14;for(let it=0;it<60;it++)for(let i=0;i<out.length;i++)for(let j=i+1;j<out.length;j++){const a=out[i],b=out[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;if(d<26){const push=(26-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}}
 out.forEach(o=>{o.x=clamp(o.x,pad,W-pad);o.y=clamp(o.y,pad,H-pad)});return {stars:out,centers}}
function gxStars(W,H){const L=gxLayout(W,H),now=Date.now();L.stars.forEach(o=>{const G=S.games[o.g]||{},plays=G.plays||0,days=G.last?(now-G.last)/864e5:999;o.plays=plays;o.days=days;o.level=gs(o.g).level;o.bright=plays?.3+.7*Math.exp(-days/14):.12;o.r=plays?3.2+Math.sqrt(plays)*1.5:2.4});return L}
SCREENS.galaxy={title:'Neural Galaxy',
 html(){const games=Object.keys(GAMES);return `<div class="sec-h"><div><div class="eyebrow">Laboratorio</div>${labBack}<h1>NEURAL GALAXY</h1><p>Cada estrella es un juego. Su tamaño crece con tus partidas y su brillo con lo reciente que la jugaste (se apaga poco a poco en unas dos semanas). Las estrellas huecas aún no las has jugado.</p></div></div>
  <div class="card gx-card" data-stim><canvas id="gxc" aria-label="Mapa de estrellas de tus juegos; usa la lista de abajo para acceder con teclado"></canvas><div class="gx-tip" id="gxt" hidden></div></div>
  <section class="section card pad-lg"><h3>Lista de juegos</h3><p class="small muted">Misma información que la galaxia, accesible con teclado.</p><ul class="gx-list" id="gxl">${SKILLS.map(s=>`<li class="gx-grp"><b style="color:${s.color}">${s.world}</b><ul>${s.games.filter(g=>GAMES[g]).map(g=>{const G=S.games[g]||{},d=GAMES[g];return `<li><button class="gx-b" data-play="${g}" style="--c:${s.color}"><i></i>${esc(d.name)}<small>${G.plays?`${G.plays} partida${G.plays>1?'s':''} · nivel ${gs(g).level}${G.last?' · '+fmtDate(dkey(new Date(G.last))):''}`:'sin jugar'}</small></button></li>`}).join('')}</ul></li>`).join('')}</ul></section>`},
 mount(m){
  const cv=$('#gxc',m),tip=$('#gxt',m),g=cv.getContext('2d'),rm=RM();let W=0,H=0,L=null,raf=0,hov=null,dpr=Math.min(2,devicePixelRatio||1);
  const fit=()=>{const w=cv.parentElement.clientWidth,h=Math.round(clamp(w*.62,300,520));if(w===W&&h===H)return;W=w;H=h;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(dpr,0,0,dpr,0,0);L=gxStars(W,H)};
  const pick=(x,y)=>{let b=null,bd=16;L.stars.forEach(o=>{const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;b=o}});return b};
  const draw=t=>{if(UI.cur!=='galaxy'){cancelAnimationFrame(raf);return}fit();g.clearRect(0,0,W,H);g.fillStyle='#070C1C';g.fillRect(0,0,W,H);
   SKILLS.forEach(s=>{const c=L.centers[s.id],gr=g.createRadialGradient(c.x,c.y,0,c.x,c.y,Math.min(W,H)*.24);gr.addColorStop(0,s.color+'26');gr.addColorStop(1,s.color+'00');g.fillStyle=gr;g.beginPath();g.arc(c.x,c.y,Math.min(W,H)*.24,0,7);g.fill();g.fillStyle='#9CC2FF99';g.font='600 11px system-ui,sans-serif';g.textAlign='center';g.fillText(s.short.toUpperCase(),c.x,c.y+Math.min(W,H)*.2)});
   SKILLS.forEach(s=>{const ss=L.stars.filter(o=>o.sk===s.id);g.strokeStyle=s.color+'30';g.lineWidth=1;ss.forEach((a,i)=>{const b=ss[(i+1)%ss.length];if(a!==b){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}})});
   L.stars.forEach((o,i)=>{const tw=rm?1:.88+.12*Math.sin(t*.002+i*1.7),br=o.bright*tw,r=o.r*(o===hov?1.5:1);const gr=g.createRadialGradient(o.x,o.y,0,o.x,o.y,r*4);gr.addColorStop(0,o.col+Math.round(clamp(br,0,1)*255).toString(16).padStart(2,'0'));gr.addColorStop(1,o.col+'00');g.fillStyle=gr;g.beginPath();g.arc(o.x,o.y,r*4,0,7);g.fill();
    g.beginPath();g.arc(o.x,o.y,r,0,7);if(o.plays){g.fillStyle=o.col;g.globalAlpha=clamp(.4+br*.6,0,1);g.fill();g.globalAlpha=1}else{g.strokeStyle=o.col;g.globalAlpha=.7;g.lineWidth=1.2;g.stroke();g.globalAlpha=1}});
   if(hov){g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(hov.x,hov.y,hov.r+5,0,7);g.stroke()}
   raf=requestAnimationFrame(draw)};
  const show=o=>{hov=o;if(!o){tip.hidden=true;return}const G=S.games[o.g]||{};tip.hidden=false;tip.innerHTML=`<b>${esc(GAMES[o.g].name)}</b><span>${SK[o.sk].short} · nivel ${o.level}</span><span>${o.plays?`${o.plays} partida${o.plays>1?'s':''} · última hace ${Math.round(o.days)} día${Math.round(o.days)===1?'':'s'}`:'Sin jugar todavía'}</span><button class="btn btn-sm btn-primary" data-play="${o.g}">Jugar</button>`;tip.style.left=clamp(o.x+14,4,W-190)+'px';tip.style.top=clamp(o.y-10,4,H-110)+'px'};
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();const o=pick(e.clientX-r.left,e.clientY-r.top);if(o!==hov&&!tip.matches(':hover'))show(o)});
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();show(pick(e.clientX-r.left,e.clientY-r.top))});
  UI.gx={pick:(x,y)=>pick(x,y),stars:()=>L.stars,size:()=>[W,H]};fit();raf=requestAnimationFrame(draw)}};
SCREENS.history={title:'Historial',

  const tab=UI.histTab||'acts',flt=UI.histF||'all',lim=UI.histLim||40;
  const acts=[...S.results].reverse().filter(r=>flt==='all'||r.skill===flt),ses=[...S.sessions].reverse();
  const tname={daily:'Misión diaria',custom:'Entrenamiento personalizado',explore:'Sesión de exploración'};

 <section class="section grid2">
  <div class="card pad-lg"><h3>¿Cómo se calcula el XP?</h3><ul class="small muted" style="padding-left:1.1rem;margin-top:.5rem;display:flex;flex-direction:column;gap:.3rem">
   <li><b>Participación:</b> +10 XP por actividad completada.</li><li><b>Precisión:</b> hasta +30 XP (30 × tu precisión). Responder al azar no compensa.</li><li><b>Dificultad:</b> +2 XP por cada nivel por encima del 1.</li><li><b>Ronda perfecta:</b> +10 XP (100 % con al menos 5 respuestas).</li><li><b>Misión especial del día:</b> +40 XP · <b>Entrenamiento diario completo:</b> +50 XP.</li><li><b>Anomalía neuronal:</b> XP ×2 · <b>Partida interrumpida:</b> −50 %.</li></ul>
   <p class="note" style="margin-top:.5rem">Nivel general: 120 XP el primero y +60 XP por cada nivel siguiente. Los niveles no representan cociente intelectual ni ninguna medida clínica.</p></div>
  <div class="card pad-lg"><h3>Sobre Neuro AI</h3><p class="small" style="margin-top:.5rem">Neuro AI es un <b>entrenador algorítmico local</b>: reglas explicables que analizan tu precisión, tus tiempos (solo donde importan), la dificultad, los intentos, tu rendimiento reciente, la frecuencia de entrenamiento y los errores consecutivos. No usa redes neuronales ni se conecta a ningún servicio de IA.</p>
   <details class="explain" style="margin-top:.7rem"><summary>Arquitectura para conectar una IA real en el futuro</summary><ul><li>El navegador enviaría solo resúmenes anónimos (precisión por habilidad, niveles, tendencias) a un <b>backend propio</b>.</li><li>Ese backend guardaría la clave de la API del modelo en el servidor y aplicaría límites de uso; la clave nunca estaría en este HTML.</li><li>La respuesta del modelo se validaría y se mostraría como texto de recomendación; las reglas locales seguirían decidiendo la dificultad.</li></ul></details>

  $('#st-ca').onchange=e=>{s.colorAssist=e.target.checked;upd()};

  bind('#ac-out',()=>confirmBox('¿Cerrar sesión?','Tu progreso sigue guardado en tu cuenta y en este dispositivo. Para volver a entrar necesitarás tu nombre de usuario y tu contraseña (no se pueden recuperar si se olvidan).','Cerrar sesión',()=>{Cloud.logout().then(()=>{if(UI.cur==='settings')UI.render();toast('<b>Sesión cerrada</b>',{icon:'exit'})})}));

function exportData(){const blob=new Blob([JSON.stringify({...S,exportedAt:new Date().toISOString()},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`neuroverse-progreso-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('<b>Progreso exportado</b><small>Si tu navegador no descarga el archivo, usa «Copiar datos».</small>',{icon:'download'})}
function copyDataModal(){
  const json=JSON.stringify({...S,exportedAt:new Date().toISOString()});
  const m=modal({title:'Copiar tus datos',body:`<p class="small">Copia este texto y guárdalo (en una nota o en un mensaje a ti mismo). Para llevar tu progreso a otro dispositivo, abre allí Configuración → Pegar datos.</p><textarea class="input" id="cp-ta" readonly rows="6" style="margin-top:.7rem;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace" aria-label="Tus datos en formato JSON"></textarea><p class="note" id="cp-msg" style="margin-top:.4rem" aria-live="polite"></p>`,
    actions:[{label:'Copiar',cls:'btn-primary',fn:bg=>{const ta=$('#cp-ta',bg),msg=$('#cp-msg',bg),fallback=()=>{ta.focus();ta.select();msg.textContent='Selecciona el texto y cópialo manualmente.'};try{navigator.clipboard.writeText(json).then(()=>{msg.textContent='Copiado ✓'},fallback)}catch(e){fallback()}return false}},{label:'Cerrar',cls:'btn-ghost'}]});
  $('#cp-ta',m.el).value=json;
}
function pasteDataModal(){
  modal({title:'Pegar datos',body:`<p class="small">Pega aquí el texto que copiaste con «Copiar datos». Reemplazará el progreso de este navegador y antes de aplicarlo te pediré confirmación.</p><textarea class="input" id="ps-ta" rows="6" style="margin-top:.7rem;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace" placeholder="Pega tus datos aquí" aria-label="Datos pegados"></textarea><p class="note" id="ps-msg" style="margin-top:.4rem;color:var(--bad)" aria-live="polite"></p>`,
    actions:[{label:'Cancelar',cls:'btn-ghost'},{label:'Revisar e importar',cls:'btn-primary',fn:bg=>{const v=$('#ps-ta',bg).value.trim();if(!v){$('#ps-msg',bg).textContent='Pega primero el texto de tus datos.';return false}importJSON(v)}}]});
}
/* Crear cuenta / Ya tengo cuenta */
function accountModal(mode='signup'){
  const su=mode==='signup';
  const m=modal({title:su?'Crear cuenta':'Entrar a tu cuenta',
   body:`<div class="seg" id="ac-seg" style="margin-bottom:.9rem"><button type="button" data-m="signup" class="${su?'on':''}">Crear cuenta</button><button type="button" data-m="login" class="${su?'':'on'}">Ya tengo cuenta</button></div>
   <p class="small">${su?'Elige un nombre de usuario y una contraseña. Con ellos podrás entrar desde cualquier dispositivo y tu progreso te seguirá. Si ya jugaste aquí, ese progreso se sube a tu cuenta.':'Escribe tu nombre de usuario y tu contraseña para recuperar tu progreso en este dispositivo.'}</p>
   <div class="field" style="margin-top:.8rem"><label for="ac-u">Nombre de usuario</label><input class="input" id="ac-u" maxlength="20" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ej. neuronauta_7"></div>
   <div class="field" style="margin-top:.7rem"><label for="ac-p">Contraseña</label><input class="input" id="ac-p" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres"></div>
   ${su?`<div class="field" style="margin-top:.7rem"><label for="ac-p2">Repite la contraseña</label><input class="input" id="ac-p2" type="password" autocomplete="new-password"></div>`:''}
   <label class="note" style="display:flex;gap:.5rem;align-items:center;margin-top:.7rem;cursor:pointer"><input type="checkbox" id="ac-show"> Mostrar contraseña</label>
   <p class="note" id="ac-msg" role="alert" style="margin-top:.6rem;color:var(--bad);min-height:1.3em"></p>
   <p class="note">${su?'Usa letras, números o guion bajo (3 a 20 caracteres). <b>Guarda bien tu contraseña:</b> la cuenta no tiene correo asociado, así que no se puede recuperar si la olvidas.':'¿Olvidaste tu contraseña? Como la cuenta no tiene correo asociado, no se puede recuperar. Puedes crear una cuenta nueva y empezar de cero.'}</p>`,
   actions:[{label:'Cancelar',cls:'btn-ghost'},{label:su?'Crear cuenta':'Entrar',cls:'btn-primary',fn:()=>{submit();return false}}]});
  const q=s=>$(s,m.el),msg=t=>{q('#ac-msg').textContent=t};let sending=false;
  $$('#ac-seg button',m.el).forEach(b=>b.onclick=()=>{if(b.dataset.m!==mode){m.close();accountModal(b.dataset.m)}});
  q('#ac-show').onchange=e=>{[q('#ac-p'),q('#ac-p2')].forEach(i=>{if(i)i.type=e.target.checked?'text':'password'})};
  m.el.querySelectorAll('.input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
  async function submit(){
   if(sending)return;
   const u=q('#ac-u').value.trim(),p=q('#ac-p').value;
   if(!Cloud.validName(u))return msg('El nombre de usuario debe tener de 3 a 20 caracteres: letras, números o guion bajo (_), sin espacios ni tildes.');
   if(p.length<6)return msg('La contraseña debe tener al menos 6 caracteres.');
   if(su&&p!==q('#ac-p2').value)return msg('Las contraseñas no coinciden.');
   const btn=m.el.querySelector('.m-actions .btn-primary'),lbl=btn.textContent;
   sending=true;msg('');btn.disabled=true;btn.textContent=su?'Creando…':'Entrando…';
   try{await (su?Cloud.signup(u,p):Cloud.login(u,p));m.close();Cloud.afterAuth(su)}
   catch(e){console.warn('[cloud]',e);if(m.el.isConnected)msg(Cloud.errText(e))}
   finally{sending=false;if(btn.isConnected){btn.disabled=false;btn.textContent=lbl}}
  }
}

/* =====================================================================
   MOTOR DE JUEGO: reloj pausable, carcasa de partida, resultados
   ===================================================================== */
class Clock{
  constructor(){this.paused=false;this.ps=0;this.pt=0;this.timers=new Set();this.dead=false}
  now(){return (this.paused?this.ps:performance.now())-this.pt}
  after(ms,fn){const t={fn,due:this.now()+ms,id:null};this.timers.add(t);if(!this.paused)this._arm(t);return t}
  _arm(t){clearTimeout(t.id);t.id=setTimeout(()=>{if(this.dead||this.paused)return;this.timers.delete(t);t.fn()},Math.max(0,t.due-this.now()))}
  cancel(t){if(!t)return;clearTimeout(t.id);this.timers.delete(t)}
  /* bucle de animación pausable; si requestAnimationFrame se ralentiza o se detiene, un temporizador de respaldo mantiene el juego en marcha */
  loop(fn){const L={stop:false,last:null,ran:0};
    const body=()=>{if(L.stop||this.dead){clearInterval(L.iv);return false}if(!this.paused){const n=this.now(),dt=L.last==null?0:Math.min(100,n-L.last);L.last=n;try{fn(dt,n)}catch(e){console.error(e);L.stop=true}}L.ran=performance.now();return true};
    const step=()=>{if(body())requestAnimationFrame(step)};requestAnimationFrame(step);
    L.iv=setInterval(()=>{if(performance.now()-L.ran>150)body()},100);
    L.cancel=()=>{L.stop=true;clearInterval(L.iv)};return L}
  pause(){if(this.paused||this.dead)return;this.paused=true;this.ps=performance.now();this.timers.forEach(t=>clearTimeout(t.id))}
  resume(){if(!this.paused||this.dead)return;this.pt+=performance.now()-this.ps;this.paused=false;this.timers.forEach(t=>this._arm(t))}
  destroy(){this.dead=true;this.timers.forEach(t=>clearTimeout(t.id));this.timers.clear()}
}
const fmtEl=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${pad2(s%60)}`};
/* Cinco categorías de dificultad del juego (no de capacidad intelectual de nadie): se reparten los niveles de cada juego en cinco tramos */
const TIERS=['Principiante','Intermedio','Avanzado','Experto','Élite cognitiva'];
const tierRange=(t,max)=>[Math.floor(t*max/5)+1,Math.max(Math.floor(t*max/5)+1,Math.floor((t+1)*max/5))];
const tierIdx=(L,max)=>{for(let t=0;t<5;t++){const[a,b]=tierRange(t,max);if(L>=a&&L<=b)return t}return 4};
const tierName=(L,max)=>TIERS[tierIdx(L,max)];

/* ---------- CIRCUITOS DIARIOS y EVALUACIÓN DE REFERENCIA ----------
   Un circuito es una forma de componer la misión de hoy. «Jefe cognitivo» propone 4 desafíos difíciles (nivel +2) y da un bonus si se
   superan con ≥ 60 %. La evaluación de referencia repite 6 tareas a nivel fijo (3) para poder comparar con el tiempo, sin adaptación. */
const CIRCUITS=[
 {id:'balanced',name:'Circuito cognitivo',desc:'Un poco de todo, según tu práctica reciente.',icon:'brain',c:'#538CFF'},
 {id:'focus',name:'Foco profundo',desc:'Solo atención: interferencia, búsqueda, seguimiento y vigilancia.',icon:'hunt',c:'#35E6DF',skills:['attention']},
 {id:'memory',name:'Maestro de memoria',desc:'Memoria de trabajo, secuencias y recuerdo diferido.',icon:'memory',c:'#9B6DFF',skills:['memory']},
 {id:'logic',name:'Experto en lógica',desc:'Matrices, deducción, planificación y razonamiento.',icon:'logic',c:'#FFB547',skills:['logic']},
 {id:'flex',name:'Impulso de flexibilidad',desc:'Cambiar de regla, inducir reglas y readaptarte.',icon:'switch',c:'#C58BFF',games:['switch','reversal','rulefind','agl','stroop','hunt','lang']},
 {id:'boss',name:'Jefe cognitivo',desc:'4 desafíos difíciles (nivel +2). ≥ 60 % en todos = bonus de +40 XP.',icon:'crown',c:'#FF5470',boss:true}
];
const BOSS_POOL={attention:['mot','blink','cpt','flanker','vsearch','stroop'],memory:['nback','updater','delayed','changed','backward'],logic:['matrix','code','deduction','strategy','circuit','rotation'],learning:['rulefind','reversal','agl','switch']};
const BASELINE_GAMES=['stroop','words','pattern','flash','anagram','switch'],BASELINE_LEVEL=3;
Daily.buildCircuit=function(id,minutes,variant=0){
 const c=CIRCUITS.find(x=>x.id===id)||CIRCUITS[0],rng=seeded(`circ|${today()}|${id}|${minutes}|${variant}`),noSpeed=S.settings.noSpeed;
 const allowed=g=>GAMES[g]&&GAMES[g].daily&&!(noSpeed&&GAMES[g].speed&&!GAMES[g].daily.slowMode);
 const tie={};Object.keys(GAMES).forEach(g=>tie[g]=rng());
 const byLast=a=>a.slice().sort((x,y)=>((S.games[x]?.last||0)-(S.games[y]?.last||0))||(tie[x]-tie[y]));
 let items=[];
 if(c.boss){
  items=Object.entries(BOSS_POOL).map(([sk,pool])=>{const g=byLast(pool.filter(allowed))[0];return g&&{game:g,why:`jefe · ${SK[sk].short}`,level:Math.min(GAMES[g].maxLevel,gs(g).level+2),boost:2}}).filter(Boolean);
  items.forEach(it=>{const dd=GAMES[it.game].daily;it.budget=Math.round(clamp(150,dd.min||60,(dd.max||240)*1.25)/5)*5});
  return items}
 const pool=(c.games?c.games.filter(allowed):SKILLS.filter(s=>!c.skills||c.skills.includes(s.id)).flatMap(s=>s.games).filter(allowed));
 if(!pool.length)return Daily.buildPlan(minutes,{variant});
 const n=Math.min(pool.length,clamp(Math.round(minutes/2.5),3,8));
 items=byLast(pool).slice(0,n).map(g=>{const it={game:g,why:c.name.toLowerCase()};if(noSpeed&&GAMES[g].speed)it.mode=GAMES[g].daily.slowMode;return it});
 const total=minutes*60,base=items.map(it=>clamp(total/items.length,GAMES[it.game].daily.min||60,GAMES[it.game].daily.max||240)),k=total/sum(base);
 items.forEach((it,i)=>{const dd=GAMES[it.game].daily;it.budget=Math.round(clamp(base[i]*k,dd.min||60,(dd.max||240)*1.25)/5)*5});
 return items};
Daily.baselinePlan=()=>BASELINE_GAMES.filter(g=>GAMES[g]).map(g=>({game:g,level:BASELINE_LEVEL,budget:60,why:`referencia · nivel ${BASELINE_LEVEL} fijo`}));

 levelInfo:(L,mode)=>{const m=stMix(L),b=`${stNC(L)} colores · ${Math.round(m[1]*100)} % incongruentes · límite de ${(stLim(L)/1000).toFixed(1)} s`;

 start(ctx){
  const L=ctx.level,mode=ctx.mode,assist=S.settings.colorAssist,NC=stNC(L),lim=stLim(L),rm=RM();

  ctx.stage.innerHTML=`<div class="stroop"><div class="stroop-box" id="sbox" style="--c:var(--blue)"><div class="sdist" id="sdist" aria-hidden="true"></div><div class="srule" id="srule" aria-live="polite"></div><div class="stroop-word" id="sw" aria-live="polite"></div><div class="stroop-sym" id="ss" aria-hidden="true"></div><div class="trial-bar" id="stbw"><i id="stb"></i></div></div>

   btns.innerHTML=kind==='yn'?`<button class="cbtn yn" data-a="y" style="--k:#46D8CC"><span class="kbd">S</span>SÍ</button><button class="cbtn yn" data-a="n" style="--k:#FF65C7"><span class="kbd">N</span>NO</button>`

   sw.textContent=txt;sw.style.color=hex;box.style.setProperty('--ink',hex);

  function runInk(kind,dist){const t=trialInk(kind);t.dist=dist;setButtons('ink');setRule('Color de la TINTA','ink');present(t,precMode||mode==='master'||mode!=='time'?lim:lim*1.5)}

/* una regla es un conjunto de condiciones sobre color (c), forma (s), tamaño (z, 'S' o 'L'), una forma exceptuada (exs) o «no es de este color» (notc) */
function hMatch(r,it){
 if(r.notc)return it.c!==r.c;
 if(r.c&&it.c!==r.c)return false;

/* ---------- utilidades de estímulos ---------- */
function huntPools(L){return {HC:HCOL.slice(0,hNC(L)),HS:HSH.slice(0,hNS(L))}}
const hRand=(P,useSize)=>({c:pick(P.HC),s:pick(P.HS),z:useSize?pick(['S','L']):'L'});
function hMatching(r,P,useSize){for(let k=0;k<80;k++){const it=hRand(P,useSize);if(r.c&&!r.notc)it.c=r.c;if(r.s)it.s=r.s;if(r.z&&useSize)it.z=r.z;if(r.notc){do it.c=pick(P.HC);while(it.c===r.c)}if(r.exs){let g=0;while(it.s===r.exs&&g++<30)it.s=pick(P.HS)}if(hMatch(r,it))return it}return {c:r.c||P.HC[0],s:r.s||P.HS[0],z:'L'}}
/* distractor: cercano (rompe una o dos características de la regla) o lejano (aleatorio) */
function hDistract(r,P,useSize,L){
 if(Math.random()<hClose(L)){
  const it=hMatching(r,P,useSize),opts=[];
  if(r.c&&!r.notc)opts.push('c');if(r.s)opts.push('s');if(r.z&&useSize)opts.push('z');if(r.exs)opts.push('exs');if(r.notc)opts.push('notc');
  const n=(opts.length>=3&&Math.random()<.4)?2:1;
  for(const o of shuffle(opts).slice(0,n)){
   if(o==='c'){let g=0;do it.c=pick(P.HC);while(it.c===r.c&&g++<30)}
   else if(o==='s'){let g=0;do it.s=pick(P.HS);while(it.s===r.s&&g++<30)}
   else if(o==='z')it.z=r.z==='S'?'L':'S';
   else if(o==='exs')it.s=r.exs;
   else if(o==='notc')it.c=r.c}
  if(!hMatch(r,it))return it}
 for(let k=0;k<80;k++){const it=hRand(P,useSize);if(!hMatch(r,it))return it}
 return {c:P.HC[0],s:P.HS[0],z:'L'}}
const hLabel=(it,useSize)=>`${HSN[it.s][0]} ${HSN[it.s][2]?it.c.f:it.c.m}${useSize?(it.z==='L'?' grande':' pequeño'):''}`;
const hRuleSVGCard=(r,useSize)=>{const s=r.s||'circle',c=r.c||HCOL[0],z=r.z||'L';return `<span class="hp-it" style="width:${z==='S'?54:96}px;height:${z==='S'?54:96}px">${shapeSVG(s,c.hex)}</span>`};

const DL_WORDS=['mesa','libro','piano','ventana','puerta','camino','playa','nube','reloj','ciudad','perro','gato','silla','luna','tren','casa','agua','fuego','tierra','bosque','río','montaña','isla','puente','torre','jardín','flor','árbol','hoja','piedra','arena','barco','avión','coche','bicicleta','moneda','llave','espejo','cuchara','plato','vaso','botella','cuaderno','lápiz','pluma','tijera','paraguas','sombrero','zapato','guante','bufanda','abrigo','camisa','falda','collar','anillo','corona','castillo','escudo','espada','flecha','tambor','guitarra','violín','trompeta','campana','cohete','planeta','cometa','volcán','desierto','cascada','cueva','faro','muelle','granja','molino','caballo','vaca','oveja','cerdo','gallina','conejo','tortuga','delfín','ballena','águila','búho','mariposa','abeja','hormiga','araña','serpiente','lagarto','zorro','lobo','oso','tigre','jirafa','elefante','mono','loro','pingüino','manzana','pera','limón','uva','fresa','cereza','pan','queso','sopa','tarta','helado','café','miel'];

 start(ctx){

function sdPeers(n,br,bc){const P=[];for(let i=0;i<n*n;i++){const r=Math.floor(i/n),c=i%n,s=new Set();for(let k=0;k<n;k++){s.add(r*n+k);s.add(k*n+c)}const r0=Math.floor(r/br)*br,c0=Math.floor(c/bc)*bc;for(let a=0;a<br;a++)for(let b=0;b<bc;b++)s.add((r0+a)*n+c0+b);s.delete(i);P.push([...s])}return P}
function sdGen(n,br,bc,clues){
  const N=n*n,P=sdPeers(n,br,bc),g=new Array(N).fill(0);
  const cand=(G,i)=>{const u=new Array(n+1).fill(false);for(const p of P[i])u[G[p]]=true;const o=[];for(let v=1;v<=n;v++)if(!u[v])o.push(v);return o};
  const fill=i=>{if(i===N)return true;for(const v of shuffle(cand(g,i))){g[i]=v;if(fill(i+1))return true}g[i]=0;return false};fill(0);
  const sol=g.slice();
  const count=(G,lim)=>{let bi=-1,bcand=null;for(let i=0;i<N;i++)if(!G[i]){const c=cand(G,i);if(!c.length)return 0;if(!bcand||c.length<bcand.length){bi=i;bcand=c;if(c.length===1)break}}if(bi<0)return 1;let t=0;for(const v of bcand){G[bi]=v;t+=count(G,lim-t);if(t>=lim)break}G[bi]=0;return t};
  const p=sol.slice();let filled=N;for(const i of shuffle([...Array(N).keys()])){if(filled<=clues)break;const b=p[i];p[i]=0;if(count(p,2)!==1)p[i]=b;else filled--}
  return {puzzle:p,sol,P}
}
