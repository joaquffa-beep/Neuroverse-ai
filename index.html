    if(taps.length!==n)sc=.3*Math.min(taps.length,n)/Math.max(taps.length,n);else{const s=sum(ti)/sum(ui),err=avg(ui.map((u,i)=>Math.abs(u*s-ti[i])/ti[i]));sc=clamp(1-err*1.6,0,1)}
    endTrial(sc,taps.length!==n?`Hiciste ${taps.length} pulsaciones de ${n}`:`Precisión rítmica: ${pct(sc)}`)}
  box.addEventListener('pointerdown',e=>{const b=e.target.closest('.pad-b');if(b){e.preventDefault();press(+b.dataset.i)}});
  ctx.key(e=>{if(rh&&(e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat)press(0)}else if(!rh&&/^[1-4]$/.test(e.key)){e.preventDefault();press(+e.key-1)}});
  trial();
  return {onTimeUp(){timeUp=true;if(!busy&&!accept)ctx.end()},summary(){const n=st.sc.length;if(!n)return null;return {correct:st.ok,wrong:n-st.ok,total:n,acc:avg(st.sc),score:st.ok,extra:{mode},
   metrics:[{label:'Secuencias logradas',value:`${st.ok}/${n}`},{label:'Precisión media',value:pct(avg(st.sc))},{label:'Modo',value:mode==='rhythm'?'Ritmo':mode==='visual'?'Visual':'Melodía'}],
   details:`<h4>${rh?'Precisión rítmica':'Memoria de secuencias'}</h4><p>${rh?'Comparamos los intervalos entre tus pulsaciones con los del patrón, permitiendo un tempo algo más rápido o lento. Una secuencia se considera lograda a partir del 70 %.':'La precisión de cada ronda es la parte de la melodía que repetiste antes del primer error.'}</p>`}}};
 }});

const SWS=['triangle','star','cross','circle'],SWC=[{n:'ROJO',h:'#FF4D5E'},{n:'VERDE',h:'#2FBF71'},{n:'AMARILLO',h:'#F2B705'},{n:'AZUL',h:'#3D7BFF'}],SWR=[{id:'color',n:'COLOR',c:'#FF65C7'},{id:'shape',n:'FORMA',c:'#35E6DF'},{id:'num',n:'NÚMERO',c:'#FFB547'}];
const swCard=(s,c,n,assist)=>Array.from({length:n+1},()=>shapeSVG(SWS[s],SWC[c].h)).join('')+(assist?`<span class="sw-cn">${SWC[c].n}</span>`:'');
reg({id:'switch',skill:'learning',name:'Cambio de reglas',icon:'switch',tagline:'Clasifica cartas según la regla activa… que irá cambiando.',
 howTo:['Cada carta tiene una forma, un color y un número de figuras.','Colócala en la pila que coincida según la regla activa: COLOR, FORMA o NÚMERO (teclas 1–4).','La regla cambia de vez en cuando, pero siempre se anuncia con un aviso claro.'],
 maxLevel:10,metric:{label:'Aciertos',better:'high'},daily:{min:60,max:150},
 levelInfo:L=>`La regla cambia ${L<=2?'cada 10 cartas':L<=4?'cada 8 cartas':L<=6?'cada 6 cartas':L<=8?'cada 4–7 cartas':'cada 3–6 cartas'} · aviso de ${(Math.max(800,1400-L*60)/1000).toFixed(1)} s`,
 start(ctx){
  const L=ctx.level,assist=S.settings.colorAssist,freeze=Math.max(800,1400-L*60),every=()=>L<=2?10:L<=4?8:L<=6?6:L<=8?ri(4,7):ri(3,6);
  const st={c:0,w:0,rts:[],swRts:[],stayRts:[],switches:0};let rule=pick(SWR),left=every(),card=null,t0=0,frozen=false,afterSwitch=false;
  ctx.stage.innerHTML=`<div class="g-wrap"><div class="sw-rule" id="swr" aria-live="assertive"></div><div style="min-height:clamp(175px,40vw,230px);display:grid;place-items:center" id="swc"></div><div class="sw-piles" id="swp">${[0,1,2,3].map(i=>`<button class="sw-pile" data-i="${i}" aria-label="Pila ${i+1}: ${i+1} ${SWC[i].n.toLowerCase()} ${['triángulo','estrella','cruz','círculo'][i]}"><span class="kbd">${i+1}</span>${swCard(i,i,i,assist)}</button>`).join('')}</div><div class="fb" id="swf"></div></div>`;
  const piles=$$('.sw-pile',ctx.stage);
  const showRule=flash=>{const r=$('#swr');r.style.setProperty('--rc',rule.c);r.innerHTML=`${ic('switch')} Regla: ${rule.n}`;if(flash){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}};
  function deal(){let s,c,n;do{s=ri(0,3);c=ri(0,3);n=ri(0,3)}while(new Set([s,c,n]).size<2);card={s,c,n};$('#swc').innerHTML=`<div class="sw-card" aria-label="Carta: ${n+1} ${(n?['triángulos','estrellas','cruces','círculos']:['triángulo','estrella','cruz','círculo'])[s]} de color ${SWC[c].n.toLowerCase()}">${swCard(s,c,n,assist)}</div>`;t0=ctx.clock.now()}
  function choose(i){if(!card||frozen||ctx.clock.paused)return;const want=rule.id==='color'?card.c:rule.id==='shape'?card.s:card.n,ok=i===want,rt=ctx.clock.now()-t0;
    if(ok){st.c++;st.rts.push(rt);(afterSwitch?st.swRts:st.stayRts).push(rt)}else st.w++;afterSwitch=false;
    piles[want].classList.add('right');if(!ok)piles[i].classList.add('wrong');ctx.feedback(ok,{msg:ok?'Correcto':`Incorrecto: por ${rule.n.toLowerCase()} iba en la pila ${want+1}`,noFlash:true});
    $('#swf').className='fb '+(ok?'ok':'bad');$('#swf').textContent=ok?'¡Bien!':`Por ${rule.n.toLowerCase()}, iba en la pila ${want+1}`;ctx.score(st.c,'Aciertos');ctx.hits(st.c);card=null;
    ctx.clock.after(ok?260:800,()=>{piles.forEach(p=>p.classList.remove('right','wrong'));$('#swf').textContent='';left--;
      if(left<=0){let r;do r=pick(SWR);while(r===rule);rule=r;left=every();st.switches++;afterSwitch=true;frozen=true;showRule(true);Sound.alert();ctx.say(`Cambio de regla: ahora ${rule.n}`);
        $('#swc').innerHTML=`<div class="arena-banner" style="position:relative;border-radius:18px;padding:26px"><div><b>¡CAMBIO DE REGLA!</b>Ahora clasifica por ${rule.n}</div></div>`;ctx.clock.after(freeze,()=>{frozen=false;deal()})}else deal()})}
  $('#swp').addEventListener('click',e=>{const b=e.target.closest('.sw-pile');if(b)choose(+b.dataset.i)});
  ctx.key(e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(+e.key-1)}});
  showRule(false);deal();ctx.countdown(ctx.budget||60000,()=>ctx.end());ctx.score(0,'Aciertos');
  return {summary(){const n=st.c+st.w;if(!n)return null;const sw=avg(st.swRts),stay=avg(st.stayRts);return {correct:st.c,wrong:st.w,total:n,acc:st.c/n,score:st.c,rt:avg(st.rts),extra:{switches:st.switches,cost:sw&&stay?Math.round(sw-stay):null},
   metrics:[{label:'Aciertos',value:`${st.c}/${n}`},{label:'Cambios de regla',value:st.switches},{label:'Tiempo medio',value:st.rts.length?Math.round(avg(st.rts))+' ms':'—'},{label:'Coste del cambio',value:sw&&stay?Math.round(sw-stay)+' ms':'—'}],
   details:sw&&stay?`<h4>Flexibilidad cognitiva</h4><p>Tras un cambio de regla tardaste de media <b>${Math.round(sw)} ms</b> en la primera carta, frente a <b>${Math.round(stay)} ms</b> con la regla ya asentada. Esa diferencia es tu «coste de cambio» dentro del juego.</p>`:''}}};
 }});

function init(){
  load();applySettings();UI.init();BG.init();Tip.init();initRipple();
  if(!storageOK)setTimeout(()=>toast('<b>Sin almacenamiento local</b><small>Puedes jugar, pero el progreso no se guardará al cerrar la página.</small>',{icon:'info',color:'var(--warn)',ms:7000}),800);
  UI.go('home');
  if(!S.profile.onboarded)Onboarding.open();
  Cloud.start();
}
init();
</script>
