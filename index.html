  std:['Cada carta tiene una forma, un color y un número de figuras.','Colócala en la pila que coincida según la regla activa: COLOR, FORMA o NÚMERO (teclas 1–4).','La regla cambia de vez en cuando, pero siempre se anuncia con un aviso claro.'],
  unpred:['Igual que el modo básico, pero la regla cambia tras un número <b>variable</b> de cartas.','Antes de cada cambio puede aparecer un aviso breve y siempre se anuncia el cambio con una pausa.','Medimos cuánto cuesta cambiar de regla y si insistes en la anterior.'],
  cond:['El <b>marco</b> de cada carta te dice qué regla aplicar. La tabla de arriba lo resume (por ejemplo: marco sólido → FORMA; marco discontinuo → NÚMERO).','Clasifica según la regla de ese marco. Las reglas por marco no cambian durante la partida.','Con más marcos hay más asociaciones que recordar.'],
  reversal:['Funciona como el modo condicional, pero cada cierto tiempo <b>la tabla se actualiza</b>: la misma señal pasa a significar otra regla.','Cuando cambie, se te muestra la tabla nueva con una pausa. Abandona la asociación anterior y aplica la nueva.','Contamos los errores «perseverativos»: seguir con la regla antigua tras el cambio.'],
  memory:['Verás una <b>secuencia de reglas</b> (por ejemplo COLOR → FORMA → NÚMERO). Memorízala.','Después se ocultará y se repartirán cartas: la 1.ª carta se clasifica con la 1.ª regla, la 2.ª con la 2.ª, y así hasta el final.','Un indicador te dice en qué carta de la secuencia vas, pero no qué regla toca.'],
  double:['Cada carta se clasifica por la dimensión activa (COLOR, FORMA o NÚMERO), y además el <b>marco</b> decide si la pila es la <b>correcta</b> (marco sólido) o la <b>contraria</b> (marco discontinuo: 1↔4 y 2↔3).','La dimensión cambia de vez en cuando con un aviso; la tabla del marco siempre está visible arriba.','Puedes pulsar la pila o usar las teclas 1–4.'],
  chaos:['Es el modo más exigente: se suceden bloques con reglas distintas (básica, condicional, reversible, doble, memoria).','Antes de cada bloque verás su regla con un ejemplo. Algunas cartas llevan una <b>✕</b>: no se clasifican, se pulsan <b>SALTAR</b> (tecla 0 o Espacio).','Hay descanso sin penalización entre bloques.']
 }[m]||[]),
 example:m=>({
  std:swExample('Con la regla COLOR, esta carta (rojo, 1 triángulo) va en la pila 1 (la roja).',`<div class="sw-card" style="width:90px">${swCard(0,0,0,false)}</div>`),
  unpred:swExample('Esta carta (roja, 1 estrella): con la regla COLOR va en la pila 1 (la roja); si la regla cambia a FORMA, va en la pila 2 (la de las estrellas). Mira siempre la regla actual.',`<div class="sw-card" style="width:90px">${swCard(1,0,0,false)}</div>`),
  cond:swExample('Tabla: marco sólido → FORMA, marco discontinuo → NÚMERO. Una carta con marco sólido y una estrella va en la pila 2 (la de las estrellas).',`<div class="sw-card" data-fr="a" style="width:90px">${swCard(1,3,0,false)}</div>`),
  reversal:swExample('Antes: marco sólido → FORMA. Tras el cambio: marco sólido → NÚMERO. Esta carta (triángulo rojo, 3 figuras) iba en la pila 1 (forma) y ahora va en la pila 3 (3 figuras).',`<div class="sw-card" data-fr="a" style="width:90px">${swCard(0,0,2,false)}</div>`),
  memory:swExample('Secuencia: COLOR → NÚMERO → FORMA. La 1.ª carta se clasifica por color, la 2.ª por número y la 3.ª por forma.',`<div class="sw-card" style="width:90px">${swCard(3,1,0,false)}</div>`),
  double:swExample('Regla COLOR con marco discontinuo: una carta roja iría en la pila 1, pero al ser «contraria» va en la <b>4</b>.',`<div class="sw-card" data-fr="m" style="width:90px">${swCard(0,0,0,false)}</div>`),
  chaos:swExample('Una carta con ✕ no se clasifica: pulsa SALTAR. Las demás, según la regla del bloque.',`<div class="sw-card" style="width:90px">${swCard(0,2,1,false)}<div class="sw-nogo">✕</div></div>`)
 }[m]||''),
 modes:SWMODES,
 maxLevel:15,metric:{label:'Aciertos',better:'high'},daily:{min:60,max:150},
 levelInfo:(L,mode)=>{const ch=mode==='unpred'?(L<=4?'cada 4–9 cartas':L<=9?'cada 3–8 cartas':'cada 2–6 cartas'):L<=2?'cada 10 cartas':L<=4?'cada 8 cartas':L<=6?'cada 6 cartas':L<=8?'cada 4–7 cartas':L<=10?'cada 3–6 cartas':L<=12?'cada 3–5 cartas':'cada 2–4 cartas',aviso=`aviso de ${(swFreeze(L)/1000).toFixed(1)} s`;
  if(mode==='cond')return `${swFrames(L,mode)} marcos con regla propia · sin cambios`;
  if(mode==='reversal')return `${swFrames(L,mode)} marcos · la tabla se actualiza cada ${swRevEvery(L)} cartas · ${aviso}`;
  if(mode==='memory')return `secuencia de ${swSeqLen(L)} reglas · se muestra ${(swSeqShow(L)/1000).toFixed(1)} s y se oculta`;
  if(mode==='double')return `la dimensión cambia ${ch} · marco sólido = pila correcta, discontinuo = pila contraria`;
  if(mode==='chaos')return `${swBlocks(L)} bloques de reglas combinadas · cartas con ✕ (saltar) · descanso entre bloques`;
  return `La regla cambia ${ch} · ${aviso}`},
 start(ctx){
  const L=ctx.level,mode=ctx.mode,assist=S.settings.colorAssist,freeze=swFreeze(L),chaos=mode==='chaos';
  const dur=ctx.budget||(mode==='std'||mode==='unpred'?60000:75000);
  const T=[];                                        /* registro de cartas: {ok,rt,first,post,pers,nogo,skip,am} */
  let am=chaos?null:mode,dim=null,map={},inv={},frames=[],seq=[],turn=0,left=0,card=null,t0=0,frozen=false,sinceChange=99,prev=null,changes=0,updates=0,done=false,blockIdx=0,blockLeft=0,blockPhases=[],resting=false,afterFirst=false;
  ctx.stage.innerHTML=`<div class="g-wrap" style="position:relative"><div class="sw-rule" id="swr" aria-live="assertive"></div><div class="swl" id="swl"></div><div style="min-height:clamp(175px,40vw,230px);display:grid;place-items:center" id="swc"></div><div class="sw-piles" id="swp">${[0,1,2,3].map(i=>`<button class="sw-pile" data-i="${i}" aria-label="Pila ${i+1}: ${i+1} ${SWC[i].n.toLowerCase()} ${['triángulo','estrella','cruz','círculo'][i]}"><span class="kbd">${i+1}</span>${swCard(i,i,i,assist)}</button>`).join('')}</div>${chaos?`<button class="btn btn-lg" id="sw-skip" style="width:100%;margin-top:.2rem">SALTAR <span class="kbd">0</span></button>`:''}<div class="fb" id="swf"></div></div>`;
  const piles=$$('.sw-pile',ctx.stage),root=$('.g-wrap',ctx.stage);
  const want=(c,d,v)=>{const x=d==='color'?c.c:d==='shape'?c.s:c.n;return v?3-x:x};
  const rule=()=>{if(am==='cond'||am==='reversal')return null;return dim};
  const ansNow=c=>{switch(am){case 'cond':case 'reversal':return want(c,map[c.fr],false);case 'double':return want(c,dim,!!inv[c.fr]);case 'memory':return want(c,seq[turn],false);default:return want(c,dim,false)}};
  const ansPrev=c=>{if(!prev)return null;switch(prev.am){case 'cond':case 'reversal':return c.fr?want(c,prev.map[c.fr],false):null;case 'double':return want(c,prev.dim,!!prev.inv[c.fr]);case 'memory':return null;default:return prev.dim?want(c,prev.dim,false):null}};
  const snap=()=>({am,dim,map:{...map},inv:{...inv}});
  /* ---- configuración de cada tipo de bloque ---- */
  function setup(m){am=m;left=swEvery(L,m);sinceChange=99;prev=null;
   if(m==='std'||m==='unpred'||m==='double')dim=pick(SWDIMS);
   if(m==='cond'||m==='reversal'){const n=swFrames(L,m);frames=SWFR.slice(0,n);const ds=shuffle(SWDIMS);map={};frames.forEach((f,i)=>map[f.id]=ds[i%3]);left=m==='reversal'?swRevEvery(L):9999}
   if(m==='double'){frames=SWFR.slice(0,2);inv={a:false,m:true}}
   if(m==='memory'){newSeq(true);}
   drawLegend()}
  function newSeq(first){seq=[];for(let i=0;i<swSeqLen(L);i++){let d,g=0;do d=pick(SWDIMS);while(i&&d===seq[i-1]&&g++<10);seq.push(d)}turn=0}
  /* ---- leyenda / regla visible ---- */
  const swatch=f=>`<i class="fr-sw" data-fr="${f.id}" aria-hidden="true"></i>`;
  function drawLegend(){const r=$('#swr'),l=$('#swl');l.innerHTML='';r.style.setProperty('--rc','#FF65C7');
   if(am==='cond'||am==='reversal'){r.innerHTML=`${ic('switch')} Cada marco, su regla`;l.innerHTML=frames.map(f=>`<span class="swl-i">${swatch(f)} marco ${f.n} → <b>${SWDIM[map[f.id]]}</b></span>`).join('')}
   else if(am==='double'){r.style.setProperty('--rc',SWR.find(x=>x.id===dim).c);r.innerHTML=`${ic('switch')} Regla: ${SWDIM[dim]}`;l.innerHTML=frames.map(f=>`<span class="swl-i">${swatch(f)} marco ${f.n} → <b>${inv[f.id]?'pila CONTRARIA (1↔4, 2↔3)':'pila CORRECTA'}</b></span>`).join('')}
   else if(am==='memory'){r.innerHTML=`${ic('switch')} Carta ${turn+1} de ${seq.length}`;l.innerHTML=`<span class="swl-i">${seq.map((_,i)=>`<i class="sq-dot${i<turn?' d':i===turn?' on':''}"></i>`).join('')} aplica la regla que tocaba en tu secuencia</span>`}
   else{const x=SWR.find(o=>o.id===dim);r.style.setProperty('--rc',x.c);r.innerHTML=`${ic('switch')} Regla: ${x.n}`}
   if(chaos&&am)l.insertAdjacentHTML('afterbegin',`<span class="swl-i sw-phase">Bloque ${blockIdx} de ${swBlocks(L)} · ${SWMODES.find(m=>m.id===am).name}</span>`)}
  /* ---- cartas ---- */
  function newCard(){
   for(let k=0;k<60;k++){const s=ri(0,3),c=ri(0,3),n=ri(0,3);if(new Set([s,c,n]).size<2)continue;
    const cd={s,c,n,fr:(am==='cond'||am==='reversal'||am==='double')?pick(frames).id:null,nogo:chaos&&blockLeft<blockLen()-2&&Math.random()<.18};
    if(!cd.nogo&&sinceChange<3&&prev){const o=ansPrev(cd),a=ansNow(cd);if(o!=null&&o===a)continue}
    if(am==='double'&&!cd.nogo&&cd.fr==null)continue;
    return cd}
   return {s:0,c:1,n:2,fr:null,nogo:false}}
  const blockLen=()=>({memory:swSeqLen(L)*2,cond:10,reversal:Math.max(12,swRevEvery(L)*2),double:10,std:10,unpred:10}[am]||10);
  function deal(){card=newCard();const frame=card.fr?`data-fr="${card.fr}"`:'';const fl=card.fr?`, marco ${SWFR.find(f=>f.id===card.fr).n}`:'';
   $('#swc').innerHTML=`<div class="sw-card" ${frame} aria-label="Carta: ${card.n+1} ${(card.n?['triángulos','estrellas','cruces','círculos']:['triángulo','estrella','cruz','círculo'])[card.s]} de color ${SWC[card.c].n.toLowerCase()}${fl}${card.nogo?' · marcada con una X: saltar':''}">${swCard(card.s,card.c,card.n,assist)}${card.nogo?'<div class="sw-nogo">✕</div>':''}</div>`;t0=ctx.clock.now();
   $('#swf').textContent='';piles.forEach(p=>p.classList.remove('right','wrong'));
   if(am==='memory'&&!card.nogo)drawLegend()}
  /* ---- aviso de cambio con pausa ---- */
  function banner(title,body,after){frozen=true;card=null;const r=$('#swr');r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash');Sound.alert();ctx.say(title.replace(/[¡!]/g,''));
   $('#swc').innerHTML=`<div class="arena-banner" style="position:relative;border-radius:18px;padding:26px"><div><b>${title}</b>${body}</div></div>`;
   ctx.clock.after(freeze,()=>{if(done)return;frozen=false;after?after():deal()})}
  /* ---- respuesta ---- */
  function record(ok,rt,extra={}){T.push({ok,rt:Math.round(rt),first:sinceChange===0,post:sinceChange<3&&prev!=null,am,...extra});sinceChange++;ctx.score(T.filter(x=>x.ok).length,'Aciertos');ctx.hits(T.filter(x=>x.ok).length)}
  function respond(i){ /* i = 0..3 pila, -1 saltar */
   if(!card||frozen||resting||ctx.clock.paused)return;const c=card,rt=ctx.clock.now()-t0;card=null;let ok,msg,pers=false;
   if(c.nogo){ok=i===-1;record(ok,rt,{nogo:true,skip:i===-1});msg=ok?'¡Bien frenado!':'Era una carta con ✕: había que saltarla';
    ctx.feedback(ok,{msg,noFlash:true});$('#swf').className='fb '+(ok?'ok':'bad');$('#swf').textContent=ok?'¡Bien!':'Con ✕: saltar'}
   else{const w=ansNow(c);ok=i===w;if(!ok&&i>=0&&sinceChange<3&&prev){const o=ansPrev(c);if(o!=null&&o===i&&o!==w)pers=true}
    record(ok,rt,{pers,skipWrong:i===-1});piles[w].classList.add('right');if(!ok&&i>=0)piles[i].classList.add('wrong');
    const ruleTxt=(am==='cond'||am==='reversal')?`marco ${SWFR.find(f=>f.id===c.fr).n} → ${SWDIM[map[c.fr]]}`:am==='memory'?SWDIM[seq[turn]]:am==='double'?`${SWDIM[dim]}${inv[c.fr]?' (contraria)':''}`:SWDIM[dim];
    msg=ok?'Correcto':`Incorrecto: por ${ruleTxt.toLowerCase()} iba en la pila ${w+1}`;ctx.feedback(ok,{msg,noFlash:true});$('#swf').className='fb '+(ok?'ok':'bad');$('#swf').textContent=ok?'¡Bien!':(pers?`Seguías la regla anterior · iba en la pila ${w+1}`:`Iba en la pila ${w+1}`)}
   ctx.clock.after(ok?260:850,()=>{if(done)return;piles.forEach(p=>p.classList.remove('right','wrong'));$('#swf').textContent='';afterCard(c)})}
  /* ---- qué viene después de cada carta ---- */
  function afterCard(c){
   if(chaos){blockLeft--;if(blockLeft<=0)return nextBlock()}
   if(c.nogo)return deal();                      /* las cartas con ✕ no hacen avanzar ni la regla ni la secuencia */
   if(am==='memory'){turn++;if(turn>=seq.length){newSeq();return banner('NUEVA SECUENCIA','Memoriza la nueva secuencia de reglas',()=>showSeq(()=>deal()))}drawLegend();return deal()}
   if(am==='cond')return deal();
   left--;if(left<=0)return change();
   return deal()}
  function change(){
   changes++;
   if(am==='reversal'){prev=snap();updates++;const ds=frames.map(f=>map[f.id]);let nm,g=0;do{const sh=shuffle(frames.map(f=>map[f.id]));nm={};frames.forEach((f,i)=>nm[f.id]=sh[i])}while(frames.some(f=>nm[f.id]===map[f.id])&&g++<30);
    /* con 3 marcos y 3 dimensiones, la tabla nueva es una permutación sin puntos fijos; con 2 marcos se intercambian */
    if(frames.length===2){nm={};nm[frames[0].id]=map[frames[1].id];nm[frames[1].id]=map[frames[0].id]}
    map=nm;sinceChange=0;left=swRevEvery(L);drawLegend();return banner('¡LA TABLA CAMBIÓ!','Ahora: '+frames.map(f=>`marco ${f.n} → ${SWDIM[map[f.id]]}`).join(' · '))}
   if(am==='double'){prev=snap();updates++;let d;do d=pick(SWDIMS);while(d===dim);dim=d;
    if(L>=8&&Math.random()<.35){inv={a:inv.a?false:true,m:inv.m?false:true}}   /* a veces se invierte también la tabla de marcos */
    sinceChange=0;left=swEvery(L,am);drawLegend();return banner('¡CAMBIO DE REGLA!',`Ahora clasifica por ${SWDIM[dim]}${L>=8?'. Revisa la tabla de marcos.':''}`)}
   /* std / unpred / caos: cambia la dimensión */
   prev=snap();updates++;let d;do d=pick(SWDIMS);while(d===dim);dim=d;sinceChange=0;left=swEvery(L,am);drawLegend();
   return banner('¡CAMBIO DE REGLA!',`Ahora clasifica por ${SWDIM[dim]}`)}
  /* ---- memoria de secuencia ---- */
  function showSeq(after){frozen=true;card=null;const show=swSeqShow(L);
   $('#swc').innerHTML=`<div class="arena-banner" style="position:relative;border-radius:18px;padding:22px"><div><b>MEMORIZA LA SECUENCIA</b>${seq.map((d,i)=>`<span class="sq-chip">${i+1}. ${SWDIM[d]}</span>`).join('')}<div class="hp-bar"><i></i></div></div></div>`;
   const i=$('.hp-bar i',$('#swc'));if(i&&!RM()){i.style.transition=`transform ${show}ms linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.transform='scaleX(0)'}))}
   $('#swr').innerHTML=`${ic('switch')} Memoriza la secuencia`;$('#swl').innerHTML='';Sound.alert();ctx.say('Memoriza la secuencia de reglas');
   ctx.clock.after(show,()=>{if(done)return;frozen=false;drawLegend();after()})}
  /* ---- caos: bloques con tarjeta de reglas y descanso ---- */
  function nextBlock(){
   if(blockIdx>=swBlocks(L)){done=true;return ctx.end()}
   const ph=blockPhases[blockIdx%blockPhases.length];blockIdx++;resting=true;card=null;$('#swc').innerHTML='';
   const info={std:['Regla básica','Clasifica por la dimensión indicada; cambia con aviso.'],cond:['Regla condicional','El marco de la carta decide qué dimensión usar (mira la tabla).'],reversal:['Cambio reversible','Como el condicional, pero la tabla se actualiza durante el bloque.'],double:['Doble cambio','Dimensión activa + marco sólido (pila correcta) o discontinuo (pila contraria).'],memory:['Switch + memoria','Memoriza la secuencia de reglas y aplícalas en orden.']}[ph];
   const b=document.createElement('div');b.className='sbrief';b.style.borderRadius='24px';b.innerHTML=`<div class="sb-in"><div class="eyebrow">Bloque ${blockIdx} de ${swBlocks(L)}</div><h3>${info[0]}</h3><p>${info[1]}</p><p class="note">Recuerda: las cartas con ✕ se saltan.</p><button class="btn btn-primary" id="swb-go">Empezar bloque</button><p class="note">${blockIdx>1?'Descanso sin penalización.':'No hay prisa en las tarjetas.'}</p></div>`;root.appendChild(b);
   $('#swb-go',b).onclick=()=>{if(ctx.clock.paused)return;b.remove();resting=false;setup(ph);blockLeft=blockLen();if(ph==='memory'){showSeq(()=>deal())}else deal()};$('#swb-go',b).focus({preventScroll:true})}
  $('#swp').addEventListener('click',e=>{const b=e.target.closest('.sw-pile');if(b)respond(+b.dataset.i)});
  const sk=$('#sw-skip');if(sk)sk.addEventListener('click',()=>respond(-1));
  ctx.key(e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();respond(+e.key-1)}else if(chaos&&(e.key==='0'||e.key===' ')){e.preventDefault();respond(-1)}});
  /* ---- arranque ---- */
  ctx.score(0,'Aciertos');
  if(chaos){blockPhases=shuffle(swMini).slice(0,Math.min(swMini.length,swBlocks(L)));while(blockPhases.length<swBlocks(L))blockPhases.push(pick(swMini));nextBlock()}
  else{setup(mode);if(mode==='memory')showSeq(()=>deal());else deal();ctx.countdown(dur,()=>{done=true;ctx.end()})}
  /* ---- resumen ---- */
  const med=a=>{const v=a.filter(x=>x!=null);return v.length?median(v):null};
  return {peek:()=>({card,frozen,resting,am,dim,map,inv,seq,turn,sinceChange,prev,ansNow:card?ansNow(card):null}),summary(){
   const A=T.filter(x=>!x.nogo),N=T.filter(x=>x.nogo),okA=A.filter(x=>x.ok).length,okN=N.filter(x=>x.ok).length,ok=okA+okN,n=T.length;if(!n)return null;
   const rtOk=A.filter(x=>x.ok).map(x=>x.rt),first=A.filter(x=>x.ok&&x.first).map(x=>x.rt),rest=A.filter(x=>x.ok&&!x.first&&!x.post).map(x=>x.rt);
   const swCost=first.length&&rest.length?Math.round(med(first)-med(rest)):null;
   const err=A.filter(x=>!x.ok).length,pers=A.filter(x=>x.pers).length,post=A.filter(x=>x.post),postAcc=post.length?post.filter(x=>x.ok).length/post.length:null,otherA=A.filter(x=>!x.post),otherAcc=otherA.length?otherA.filter(x=>x.ok).length/otherA.length:null;
   const metrics=[{label:'Aciertos',value:`${ok}/${n}`},{label:'Cambios de regla',value:changes},{label:'Mediana de respuesta',value:rtOk.length?Math.round(med(rtOk))+' ms':'—'}];
   if(swCost!=null)metrics.push({label:'Coste de cambio',value:(swCost>=0?'+':'')+swCost+' ms'});
   if(updates&&err)metrics.push({label:'Errores perseverativos',value:`${pers}/${err}`});
   if(postAcc!=null)metrics.push({label:'Precisión tras actualizar',value:pct(postAcc)});
   if(N.length)metrics.push({label:'Cartas con ✕ saltadas',value:`${okN}/${N.length}`});
   const details=`<h4>Flexibilidad cognitiva</h4>${swCost!=null?`<p>Tras un cambio tardaste una mediana de <b>${Math.round(med(first))} ms</b> en la primera carta, frente a <b>${Math.round(med(rest))} ms</b> con la regla asentada: <b>coste de cambio ${(swCost>=0?'+':'')}${swCost} ms</b>.</p>`:''}${postAcc!=null&&otherAcc!=null?`<p>En las 3 cartas posteriores a una actualización acertaste el <b>${pct(postAcc)}</b>, frente al <b>${pct(otherAcc)}</b> en el resto.</p>`:''}${updates&&err?`<p>Un error <b>perseverativo</b> es seguir aplicando la regla anterior justo después de un cambio. Tuviste ${pers} de ${err} errores.</p>`:''}${N.length?`<p>Las cartas con ✕ eran de inhibición: lo correcto era no clasificarlas. Saltaste bien ${okN} de ${N.length}.</p>`:''}<p class="note">Estas cifras describen tu rendimiento en esta tarea; no miden capacidades generales ni dan diagnóstico.</p>`;
   return {correct:ok,wrong:n-ok,total:n,acc:ok/n,score:ok,rt:rtOk.length?avg(rtOk):null,metrics,details,
    extra:{switches:changes,cost:swCost,pers,errors:err,postAcc,otherAcc,nogo:N.length?{n:N.length,ok:okN}:null,omRate:0,faRate:N.length?(N.length-okN)/N.length:0}}}}
 }});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function init(){
  load();applySettings();Theme.start();UI.init();BG.init();Tip.init();initRipple();
  if(!storageOK)setTimeout(()=>toast('<b>Sin almacenamiento local</b><small>Puedes jugar, pero el progreso no se guardará al cerrar la página.</small>',{icon:'info',color:'var(--warn)',ms:7000}),800);
  UI.go('home');
  if(!S.profile.onboarded)Onboarding.open();
  Cloud.start();
}
init();
</script>
