<style>
/* =====================================================================
   NEUROVERSE 2.0 — SISTEMA DE DISEÑO
   1 Tokens · 2 Base · 3 Layout · 4 Componentes · 5 Dashboard · 6 Mundos
   7 Capa de juego · 8 Juegos · 9 Estadísticas · 10 Logros/Historial
   11 Overlays · 12 Accesibilidad
   Reglas: color intenso solo en lo importante · transform/opacity para
   animar · sin blur en tarjetas repetidas · el juego simplifica la UI.
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

/* ---------- 1 · TOKENS ---------- */
:root{
  --void:#060913;--deep:#0D1630;--deep-2:#14204A;
  --blue:#538CFF;--violet:#9B6DFF;--teal:#35E6DF;--pink:#FF65C7;--ice:#EDF5FF;
  --orange:#FFB547;--green:#5CFF8F;--cosmic:#C58BFF;--cosmic-2:#5E7BFF;
  --purple:var(--violet);--white:var(--ice);--bg:var(--void);--bg-2:var(--deep);--bg-3:var(--deep-2);--c2:var(--c);
  --ok:#3DDC84;--bad:#FF5470;--warn:#FFC24B;
  --text:var(--ice);--muted:#AAB7DB;--dim:#7B89B4;
  --line:rgba(140,170,255,.12);--line-2:rgba(140,170,255,.24);--line-3:rgba(170,195,255,.42);
  --panel:rgba(13,22,48,.74);--panel-2:rgba(20,32,70,.55);
  --grad-brand:linear-gradient(120deg,#4A82FF,#8C5DFF 58%,#FF5CC0);
  --grad-cool:linear-gradient(120deg,#4A82FF,#2BD9D2);
  --card-bg:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 62%);
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;--s7:3rem;
  --r-xs:8px;--r-sm:12px;--r:18px;--r-lg:24px;--r-xl:32px;
  --sh-1:0 4px 14px -6px rgba(0,0,0,.6);--sh-2:0 20px 46px -20px rgba(0,0,0,.8);
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Oxanium','Space Grotesk',system-ui,sans-serif;
  --t-2xs:.6875rem;--t-xs:.75rem;--t-sm:.8125rem;--t-md:.9375rem;--t-lg:1.0625rem;--t-xl:1.25rem;--t-2xl:1.625rem;--t-3xl:clamp(1.7rem,3.2vw,2.35rem);--t-hero:clamp(2.1rem,4.4vw,3.7rem);
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--d1:.14s;--d2:.26s;--d3:.46s;
  --fs:1;--c:var(--blue);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}

/* ---------- 2 · BASE ---------- */
html{font-size:calc(16px*var(--fs));-webkit-text-size-adjust:100%;color-scheme:dark;scroll-behavior:smooth}
body{background:var(--void);color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:'';position:fixed;inset:0;z-index:-3;background:
  radial-gradient(1000px 640px at 86% -12%,rgba(155,109,255,.2),transparent 62%),
  radial-gradient(900px 600px at -10% 28%,rgba(83,140,255,.15),transparent 60%),
  radial-gradient(800px 520px at 55% 116%,rgba(53,230,223,.08),transparent 60%),
  linear-gradient(180deg,#070B1B,var(--void))}
body::after{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(rgba(120,150,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.035) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 75%)}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#fxcv{position:fixed;inset:0;width:100%;height:100%;z-index:150;pointer-events:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:rgba(83,140,255,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(150,175,255,.18);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
.ic{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.fill{fill:currentColor;stroke:none}
h1,h2,h3,h4{line-height:1.15;font-weight:700;letter-spacing:-.005em;font-family:var(--display)}
h1{font-size:var(--t-3xl)}h2{font-size:var(--t-2xl)}h3{font-size:var(--t-xl)}h4{font-size:var(--t-lg);margin-bottom:.4rem}
p{color:var(--muted)}
b,strong{color:var(--text);font-weight:600}
.display{font-family:var(--display);letter-spacing:.06em}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-size:var(--t-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:600}
.eyebrow::before{content:'';width:18px;height:1.5px;background:currentColor;opacity:.7;border-radius:2px}
.eyebrow.nol::before{display:none}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:var(--t-sm)}
.note{font-size:var(--t-xs);color:var(--dim);line-height:1.5}
.divider{height:1px;background:var(--line);margin:1rem 0}
.pill-ok{color:var(--ok)}.pill-bad{color:var(--bad)}.pill-warn{color:var(--warn)}.up{color:var(--ok)}.down{color:var(--bad)}

/* ---------- 3 · LAYOUT ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;padding:1.25rem .9rem;display:flex;flex-direction:column;gap:.25rem;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,17,40,.9),rgba(6,9,19,.7));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:10}
.brand{display:flex;align-items:center;gap:.7rem;padding:.2rem .6rem 1.4rem;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.9rem;line-height:1.15}
.brand small{display:block;font-family:var(--font);font-weight:500;letter-spacing:.04em;color:var(--muted);font-size:var(--t-2xs)}
.logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 0 10px rgba(83,140,255,.6))}
.nav-btn{position:relative;display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border-radius:14px;color:var(--muted);background:none;border:0;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:background var(--d2),color var(--d2),transform var(--d1)}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.045)}
.nav-btn:active{transform:scale(.98)}
.nav-btn.active{color:var(--text);background:linear-gradient(90deg,rgba(83,140,255,.2),rgba(155,109,255,.04))}
.nav-btn.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--grad-cool);box-shadow:0 0 12px var(--blue)}
.nav-btn.active .ic{color:var(--teal)}
.nav-btn .ic{width:20px;height:20px}
.nav-badge{margin-left:auto;font-size:var(--t-2xs);padding:2px 8px;border-radius:20px;background:rgba(255,101,199,.16);color:var(--pink);font-weight:600}
.pilot{margin-top:auto;padding:.9rem;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid var(--line);font-size:var(--t-sm);display:flex;flex-direction:column;gap:.5rem}
.pilot-top{display:flex;align-items:center;gap:.7rem}
.pilot-top .lvl-mini{position:relative;width:44px;height:44px;flex:none}
.pilot-top .lvl-mini .lv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1rem}
.topbar{display:none}
.bottomnav{display:none}
.main{padding:1.75rem clamp(1rem,3.2vw,2.75rem) 4.5rem;max-width:1320px;width:100%;margin:0 auto;outline:none;min-width:0}
.screen-enter{animation:screenIn .5s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidenav{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;position:sticky;top:0;z-index:25;padding:.55rem 1rem;padding-top:calc(.55rem + var(--safe-t));background:linear-gradient(180deg,rgba(6,9,19,.92),rgba(6,9,19,.7));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;font-size:.8rem}
  .topbar .logo{width:30px;height:30px}
  .tb-chips{display:flex;gap:.4rem;align-items:center}
  .tb-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .65rem;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:var(--t-sm)}
  .tb-chip .ic{width:15px;height:15px}
  .topbar .brand{flex:none}
  @media (max-width:520px){.topbar .brand div{display:none}.topbar{gap:.45rem}}
  @media (max-width:360px){.topbar .icon-btn{width:40px;height:40px}.tb-chip{padding:.3rem .5rem}}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:.75rem;right:.75rem;bottom:calc(.65rem + var(--safe-b));z-index:30;padding:.35rem;border-radius:28px;background:rgba(9,15,36,.88);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line-2);box-shadow:0 18px 40px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08)}
  .main{padding:1rem 1rem calc(7.5rem + var(--safe-b))}
}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--t-2xs);color:var(--muted);background:none;border:0;padding:.45rem .1rem;border-radius:20px;cursor:pointer;min-height:54px;justify-content:center;position:relative;transition:color var(--d2)}
.bn-btn .ic{width:22px;height:22px;transition:transform var(--d2) var(--spring)}
.bn-btn.active{color:var(--text)}
.bn-btn.active .ic{color:var(--teal);filter:drop-shadow(0 0 7px rgba(53,230,223,.8));transform:translateY(-1px) scale(1.08)}
.bn-btn.active::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.bn-btn.center .bn-orb{width:52px;height:52px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:var(--grad-brand);box-shadow:0 0 0 5px rgba(9,15,36,.9),0 0 26px rgba(120,100,255,.7),inset 0 1px 0 rgba(255,255,255,.4);color:#fff;transition:transform var(--d1)}
.bn-btn.center:active .bn-orb{transform:scale(.92)}
.bn-btn.center.active .ic,.bn-btn.center .ic{color:#fff;filter:none;transform:none}
.bn-btn.center::after{display:none}

/* ---------- 4 · COMPONENTES ---------- */
.card{position:relative;background:var(--card-bg),var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.06)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(83,140,255,.1) 32%,rgba(155,109,255,.05) 62%,rgba(53,230,223,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.hud>.hud-c{position:absolute;inset:10px;pointer-events:none;opacity:.5;background:
  linear-gradient(var(--c),var(--c)) 0 0/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1.5px 14px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 14px no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 14px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/14px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 14px no-repeat}
.pad{padding:1.25rem}.pad-lg{padding:1.6rem}
.stack{display:flex;flex-direction:column;gap:.9rem}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}
.g-main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:1.1rem}
.grid2>*,.grid3>*,.g-main>*{min-width:0}
@media (max-width:1100px){.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.section{margin-top:1.8rem}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
.sec-h p{font-size:var(--t-md);margin-top:.25rem}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.15rem;min-height:46px;border-radius:15px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--text);font-weight:600;cursor:pointer;transition:transform var(--d1) var(--ease),box-shadow var(--d2),background var(--d2),border-color var(--d2);text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09);border-color:var(--line-3)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{border:0;background:var(--grad-brand);box-shadow:0 10px 30px -8px rgba(110,100,255,.65),inset 0 1px 0 rgba(255,255,255,.3);color:#fff}
.btn-primary:hover{background:var(--grad-brand);filter:brightness(1.1);box-shadow:0 12px 36px -8px rgba(130,110,255,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-teal{border:0;background:var(--grad-cool);color:#04121c;box-shadow:0 10px 28px -10px rgba(53,230,223,.7)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.btn-danger{border-color:rgba(255,84,112,.5);color:#ff9fb0;background:rgba(255,84,112,.08)}
.btn-sm{padding:.45rem .8rem;min-height:36px;font-size:var(--t-sm);border-radius:11px}
.btn-lg{padding:.95rem 1.6rem;min-height:54px;font-size:1.0625rem;border-radius:17px}
.btn-block{width:100%}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.38);transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* botón protagonista */
.btn-mission{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:.9rem;min-height:66px;padding:.55rem 1.7rem .55rem .6rem;border:0;border-radius:22px;color:#fff;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:1rem;text-align:left;cursor:pointer;background:linear-gradient(110deg,#3F78FF,#8A5CFF 56%,#FF5CC0);box-shadow:0 16px 44px -12px rgba(120,100,255,.85),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 22px rgba(0,0,0,.2);transition:transform var(--d1) var(--ease),box-shadow var(--d2),filter var(--d2)}
.btn-mission .bm-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(6,9,19,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}
.btn-mission .bm-ic .ic{width:22px;height:22px}
.btn-mission small{display:block;font-family:var(--font);font-weight:500;letter-spacing:.03em;font-size:var(--t-xs);opacity:.88;margin-top:2px}
.btn-mission::before{content:'';position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-20deg);animation:sheen 5s ease-in-out infinite;z-index:-1}
.btn-mission::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(155,109,255,.7);animation:ping 3.2s ease-out infinite;pointer-events:none}
.btn-mission:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 20px 52px -12px rgba(140,110,255,.95),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-mission:active{transform:scale(.965)}
@keyframes sheen{0%,60%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(155,109,255,.55)}70%,100%{box-shadow:0 0 0 18px rgba(155,109,255,0)}}
.icon-btn{position:relative;overflow:hidden;width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;color:var(--text);flex:none;transition:background var(--d2),transform var(--d1)}
.icon-btn:hover{background:rgba(255,255,255,.09)}
.icon-btn:active{transform:scale(.92)}
.icon-btn .ic{width:20px;height:20px}
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .85rem;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font-size:var(--t-sm);font-weight:500;cursor:pointer;min-height:36px;transition:background var(--d2),border-color var(--d2)}
.chip:hover{border-color:var(--line-3)}
.chip.on{background:linear-gradient(135deg,rgba(83,140,255,.32),rgba(155,109,255,.26));border-color:rgba(150,160,255,.6)}
.tag{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .55rem;border-radius:999px;font-size:var(--t-2xs);font-weight:600;letter-spacing:.02em;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 78%,#fff);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{position:relative;overflow:hidden;flex:1 1 auto;min-height:46px;padding:.55rem .9rem;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);cursor:pointer;font-weight:600;text-align:left;transition:background var(--d2),border-color var(--d2),transform var(--d1)}
.seg button:active{transform:scale(.97)}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:var(--t-xs)}
.seg button.on{border-color:var(--c,var(--blue));background:color-mix(in srgb,var(--c,var(--blue)) 18%,transparent);box-shadow:0 0 0 1px var(--c,var(--blue)) inset,0 0 22px -8px var(--c,var(--blue))}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}

.worlds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1.1rem;perspective:1400px}
.portal{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:0;border-radius:28px;overflow:hidden;cursor:pointer;min-height:330px;background:#0A1129;color:var(--text);isolation:isolate;--mx:50%;--my:30%;transform-style:preserve-3d;transition:transform .4s var(--ease),box-shadow .4s;box-shadow:var(--sh-2)}
.portal::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:3;pointer-events:none;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 14%,transparent) 40%,color-mix(in srgb,var(--c2) 45%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.55;transition:opacity .35s}
.portal:hover::before,.portal:focus-visible::before{opacity:1}
.portal:hover{box-shadow:0 30px 60px -22px color-mix(in srgb,var(--c) 60%,transparent)}
.p-bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(120% 80% at 92% 0%,color-mix(in srgb,var(--c) 36%,transparent),transparent 62%),radial-gradient(90% 70% at 0% 100%,color-mix(in srgb,var(--c2) 22%,transparent),transparent 70%),linear-gradient(180deg,#101A3F,#080D21)}
.p-spot{position:absolute;inset:0;z-index:-1;background:radial-gradient(280px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.portal:hover .p-spot{opacity:1}
.p-art{position:relative;height:170px;color:var(--c);flex:none}
.p-art svg{position:absolute;inset:0;width:100%;height:100%}
.p-num{position:absolute;left:1.2rem;top:1.1rem;font-family:var(--display);font-weight:800;font-size:.75rem;letter-spacing:.2em;color:color-mix(in srgb,var(--c) 70%,#fff);display:flex;align-items:center;gap:.5rem}
.p-num i{display:block;width:22px;height:1.5px;background:currentColor;opacity:.7}
.p-body{display:flex;flex-direction:column;gap:.35rem;padding:0 1.25rem 1.2rem;flex:1;transform:translateZ(24px)}
.p-name{font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:1.2rem}
.p-sk{font-size:var(--t-sm);color:color-mix(in srgb,var(--c) 55%,#fff);font-weight:600}
.p-desc{font-size:var(--t-sm);color:var(--muted);line-height:1.45}
.p-foot{display:flex;align-items:center;gap:.8rem;margin-top:auto;padding-top:.7rem}
.p-foot .bar{flex:1;height:6px}
.p-lv{font-family:var(--display);font-weight:700;font-size:var(--t-md);color:var(--c);white-space:nowrap}
.p-meta{display:flex;gap:.9rem;font-size:var(--t-xs);color:var(--dim);flex-wrap:wrap}
.p-meta span{display:inline-flex;align-items:center;gap:.3rem}
.p-meta .ic{width:14px;height:14px}
/* arte animado de cada portal: solo se mueve al interactuar */
.wa .anim{animation-play-state:paused!important}
.portal:hover .wa .anim,.portal:focus-visible .wa .anim,.world-hero:hover .wa .anim{animation-play-state:running!important}
.wa .sweep{transform-box:view-box;transform-origin:230px 90px;animation:spin 5s linear infinite}
.wa .blip{animation:blip 2.4s ease-in-out infinite}.wa .blip.b2{animation-delay:.9s}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.wa .lit{animation:blip 3s ease-in-out infinite}
.wa .spin{transform-box:view-box;transform-origin:232px 90px;animation:spin 26s linear infinite}
.wa .rise{animation:rise2 4s ease-in-out infinite}
@keyframes rise2{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}
.wa .flow{stroke-dasharray:7 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.wa .grow{stroke-dasharray:240;stroke-dashoffset:0;animation:grow 4s ease-in-out infinite}
@keyframes grow{0%{stroke-dashoffset:240}55%,100%{stroke-dashoffset:0}}
.world-hero{position:relative;overflow:hidden;padding:1.6rem;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.3rem;align-items:center;min-height:190px;border-radius:var(--r-xl)}
.world-hero .wh-bg{position:absolute;inset:0;background:radial-gradient(700px 320px at 0% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),radial-gradient(500px 300px at 100% 100%,color-mix(in srgb,var(--c2) 22%,transparent),transparent 70%)}
.world-hero .wh-art{position:absolute;right:-20px;top:0;bottom:0;width:min(46%,420px);color:var(--c);opacity:.5;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.world-hero .wh-art svg{width:100%;height:100%}
.world-hero>*:not(.wh-bg):not(.wh-art){position:relative;z-index:1}
.world-hero .wh-ring{border-radius:50%;background:radial-gradient(circle,rgba(8,13,32,.92) 56%,transparent 72%)}
.world-hero .wh-ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,#0b1230);box-shadow:0 0 44px -8px var(--c),inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.world-hero .wh-ic .ic{width:38px;height:38px}
@media (max-width:700px){.world-hero{grid-template-columns:auto minmax(0,1fr);padding:1.2rem}.world-hero .wh-ring{grid-column:1/-1}.world-hero .wh-art{width:70%;opacity:.28}}
.games-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:1rem}
.game-card{padding:1.2rem;display:flex;flex-direction:column;gap:.7rem;overflow:hidden;transition:transform var(--d2) var(--ease),box-shadow var(--d2)}
.game-card::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%);pointer-events:none;transition:transform .5s var(--ease)}
.game-card:hover{transform:translateY(-4px);box-shadow:0 24px 44px -22px color-mix(in srgb,var(--c) 55%,transparent)}
.game-card:hover::after{transform:scale(1.3)}
.game-card .gc-top{display:flex;gap:.8rem;align-items:center;position:relative;z-index:1}
.game-card .gc-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#0b1230);color:var(--c);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.game-card .gc-ic .ic{width:24px;height:24px}
.game-card .gc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;font-size:var(--t-2xs);color:var(--muted);position:relative;z-index:1}
.game-card .gc-stats b{font-family:var(--display);font-size:var(--t-md);display:block;margin-top:1px}
.game-card .btn{position:relative;z-index:1}

/* ---------- 7 · CAPA DE JUEGO (UI simplificada) ---------- */
.play{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:radial-gradient(900px 420px at 50% -8%,color-mix(in srgb,var(--c) 15%,transparent),transparent 70%),linear-gradient(180deg,#070B1B,#050813);animation:playIn .42s var(--ease)}
@keyframes playIn{from{opacity:0;transform:scale(1.025);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.play::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,150,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000,transparent 75%)}
.play-top{position:relative;display:flex;align-items:center;gap:.7rem;padding:.65rem clamp(.8rem,2.5vw,1.5rem);padding-top:calc(.65rem + var(--safe-t));border-bottom:1px solid var(--line);background:rgba(6,9,19,.6)}
.play-top::after{content:'';position:absolute;left:0;bottom:-1px;height:1px;width:34%;background:linear-gradient(90deg,var(--c),transparent);opacity:.8}
.pl-title{display:flex;align-items:center;gap:.7rem;min-width:0;flex:1}
.pl-title .pl-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,#0b1230);color:var(--c);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.pl-title b{display:block;font-family:var(--display);font-size:var(--t-md);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-title small{display:block;color:var(--muted);font-size:var(--t-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-hud{display:flex;gap:.45rem;align-items:center}
.hud-item{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;padding:.25rem .65rem;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);line-height:1.1}
.hud-item small{font-size:.56rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hud-item b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.hud-item.warn{border-color:rgba(255,194,75,.5)}.hud-item.warn b{color:var(--warn)}
.hud-item.ghost b{color:var(--cosmic);font-size:.9rem}
.hud-item.ghost.beat{border-color:var(--ok);box-shadow:0 0 16px rgba(61,220,132,.4)}
.hud-item.ghost.beat b{color:var(--ok)}
@media (max-width:640px){.pl-title small{display:none}.hud-item{min-width:52px;padding:.2rem .45rem}.hud-item b{font-size:.95rem}.hud-item.ghost{display:none}.play-top{gap:.45rem}}
.daily-strip{position:relative;padding:.6rem clamp(.8rem,2.5vw,1.5rem);border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(83,140,255,.08),rgba(155,109,255,.05))}
.ds-segs{display:flex;gap:4px;margin-bottom:.5rem}
.ds-seg{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;transform:skewX(-20deg)}
.ds-seg.done{background:var(--c);box-shadow:0 0 10px -1px var(--c)}
.ds-seg.cur{background:rgba(255,255,255,.12)}
.ds-seg.cur i{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:0 0 10px var(--c)}
.ds-seg.skip{background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 4px,transparent 4px 8px)}
.ds-info{display:flex;gap:.3rem 1.1rem;align-items:center;flex-wrap:wrap;font-size:var(--t-sm);color:var(--muted)}
.ds-info b{color:var(--text)}
.ds-info .ds-xp b{color:var(--teal);font-family:var(--display)}
.ds-info .ds-act{margin-left:auto;display:flex;gap:.5rem}
@media (max-width:640px){.ds-info .hide-sm{display:none}.ds-info{gap:.2rem .8rem}}
.stage{position:relative;flex:1;overflow:auto;padding:clamp(.9rem,3vw,1.9rem);padding-bottom:calc(clamp(.9rem,3vw,1.9rem) + var(--safe-b));display:flex;flex-direction:column;align-items:center;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stage>*{width:100%}
.stage.fx-ok{animation:flashOk .45s}
.stage.fx-bad{animation:flashBad .45s}
@keyframes flashOk{30%{box-shadow:inset 0 0 0 2px rgba(61,220,132,.5),inset 0 0 90px rgba(61,220,132,.13)}}
@keyframes flashBad{30%{box-shadow:inset 0 0 0 2px rgba(255,84,112,.55),inset 0 0 90px rgba(255,84,112,.13)}}
.intro{position:relative;max-width:760px;margin:auto;padding:1.7rem;display:flex;flex-direction:column;gap:1.2rem;animation:rise .55s var(--ease)}
.intro::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%);pointer-events:none}
.intro>*{position:relative;z-index:1}
.intro-head{display:flex;gap:1.1rem;align-items:center}
.intro-ic{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,#0b1230);box-shadow:0 0 40px -8px var(--c),inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent);flex:none}
.intro-ic .ic{width:36px;height:36px}
.howto{display:grid;gap:.5rem;counter-reset:st}
.howto li{list-style:none;counter-increment:st;display:flex;gap:.8rem;align-items:flex-start;padding:.65rem .8rem;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:var(--t-md);color:#cfd8f5}
.howto li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:var(--t-sm);color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pips{display:flex;gap:4px;margin:.5rem 0 .2rem}
.pips i{flex:1;height:7px;border-radius:3px;background:rgba(255,255,255,.08);transform:skewX(-18deg)}
.pips i.on{background:var(--c);box-shadow:0 0 8px -1px var(--c)}
.pips i.rec{outline:1.5px solid var(--teal);outline-offset:1px}
.lvl-pick{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.lvl-pick .lp-n{font-family:var(--display);font-weight:800;font-size:2rem;min-width:3.2rem;text-align:center;color:var(--c)}
.lvl-pick .lp-info{flex:1;min-width:200px;font-size:var(--t-sm);color:var(--muted)}
.intro-best{display:flex;gap:.7rem;flex-wrap:wrap}
.intro-best>div{flex:1;min-width:130px;padding:.65rem .9rem;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:var(--t-xs);color:var(--muted)}
.intro-best b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--text)}
.cd-ov{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:rgba(5,8,19,.55)}
.cd-num{font-family:var(--display);font-size:clamp(5rem,18vw,10rem);font-weight:800;color:var(--c);text-shadow:0 0 60px var(--c);animation:cdPop .62s var(--ease)}
@keyframes cdPop{from{transform:scale(1.9);opacity:0}to{transform:scale(1);opacity:1}}
.pause-ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(3,5,14,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:1.2rem}
.pause-box{padding:1.9rem;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:.8rem}
.pause-box h2{font-family:var(--display);letter-spacing:.24em}
.hint{font-size:var(--t-sm);color:var(--dim);text-align:center;margin-top:.6rem}
.g-wrap{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;align-items:center;animation:rise .45s var(--ease)}
.g-prompt{text-align:center;font-size:var(--t-md);color:var(--muted)}
.g-prompt b{color:var(--text)}
.g-big{font-family:var(--display);font-size:clamp(2.4rem,9vw,4.6rem);font-weight:700;text-align:center;letter-spacing:.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.g-big.swap{animation:numIn .3s var(--ease)}
@keyframes numIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.fb{min-height:1.7rem;text-align:center;font-weight:600;font-size:var(--t-md)}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.pop-ok{animation:popOk .4s}
@keyframes popOk{40%{transform:scale(1.07);box-shadow:0 0 0 3px var(--ok),0 0 34px rgba(61,220,132,.55)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes popIn{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
.q-bar{width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.q-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--c));transform-origin:left}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;width:100%}
.opt{position:relative;overflow:hidden;min-height:64px;padding:.8rem 1rem;border-radius:18px;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));cursor:pointer;font-size:1.0625rem;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:background var(--d2),border-color var(--d2),transform var(--d1)}
.opt:hover{background:rgba(255,255,255,.09);border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.opt:active{transform:scale(.975)}
.opt.right{border-color:var(--ok);background:rgba(61,220,132,.16);box-shadow:0 0 24px -6px var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(255,84,112,.16)}
.opt:disabled{cursor:default}
.opt .kbd{opacity:.6}
@media (max-width:520px){.opts.opts-1col{grid-template-columns:minmax(0,1fr)}}
.explain-box{width:100%;padding:.95rem 1.05rem;border-radius:16px;background:rgba(53,230,223,.07);border:1px solid rgba(53,230,223,.26);font-size:var(--t-md);color:#d7e8f5;animation:rise .35s var(--ease)}
.explain-box.bad{background:rgba(255,84,112,.07);border-color:rgba(255,84,112,.32)}
/* teclado numérico */
.kp{width:100%;max-width:350px;display:flex;flex-direction:column;gap:.6rem;margin:0 auto}
.kp-display{min-height:64px;border-radius:18px;border:1px solid var(--line-2);background:rgba(3,6,16,.7);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.08em;box-shadow:inset 0 2px 14px rgba(0,0,0,.5)}
.kp-caret{width:2px;height:30px;background:var(--c);margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.kp-k{position:relative;overflow:hidden;min-height:58px;border-radius:17px;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));font-size:1.45rem;font-weight:700;cursor:pointer;font-family:var(--display);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,background .15s}
.kp-k:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);background:rgba(255,255,255,.14)}
.kp-ok{min-height:56px}
.kp-off{opacity:.45;pointer-events:none}
.kp-display.ok{border-color:var(--ok);box-shadow:0 0 26px rgba(61,220,132,.35),inset 0 2px 14px rgba(0,0,0,.5)}
.kp-display.bad{border-color:var(--bad);box-shadow:0 0 26px rgba(255,84,112,.35),inset 0 2px 14px rgba(0,0,0,.5)}
@media (max-height:720px){.kp-k{min-height:46px;font-size:1.25rem}.kp-display{min-height:52px;font-size:1.6rem}.kp-ok{min-height:48px}}
/* resultados */
.results{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;animation:screenIn .55s var(--ease)}
.res-head{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.6rem;align-items:center;padding:1.6rem}
.res-head::after{content:'';position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%);pointer-events:none}
.res-head>*{position:relative;z-index:1}
.res-ring{position:relative;width:150px;height:150px}
.res-ring .rr-v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.res-ring .rr-v b{font-family:var(--display);font-size:2.3rem;font-weight:800}
.res-ring .rr-v small{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.2em;margin-top:5px}
.grade{width:96px;height:108px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 18px var(--gc))}
.grade svg{position:absolute;inset:0;width:100%;height:100%}
.grade b{position:relative;font-family:var(--display);font-weight:800;font-size:2.6rem;color:#fff;text-shadow:0 0 14px var(--gc)}
.grade small{position:absolute;bottom:8px;font-size:.5rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:.6rem;margin-top:1rem}
.metric{padding:.6rem .8rem;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

.rtarget{position:absolute;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 35% 35%,#fff,var(--green) 35%,#0d7a43 100%);box-shadow:0 0 0 4px rgba(92,255,143,.25),0 0 34px var(--green);animation:popIn .12s}

.rhit{position:absolute;pointer-events:none;border-radius:50%;border:2px solid var(--ok);animation:ripple .5s forwards}
.rhit.bad{border-color:var(--bad)}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.lang-card{position:relative;width:100%;max-width:520px;padding:1.9rem 1.5rem;text-align:center;border-radius:28px;background:radial-gradient(circle at 50% 0%,rgba(197,139,255,.22),transparent 70%),rgba(255,255,255,.04);border:1px solid rgba(197,139,255,.4);animation:popIn .35s var(--ease);box-shadow:0 0 60px -26px var(--cosmic)}
.lang-word{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,7vw,2.9rem);color:var(--cosmic);margin:.4rem 0}
.lang-mean{font-size:1.25rem;color:var(--text)}
.speak{margin-top:.7rem}
.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;width:min(100%,420px)}
.pad-b{aspect-ratio:1.25;border-radius:26px;border:1px solid color-mix(in srgb,var(--k) 60%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--k) 28%,#0b1230),color-mix(in srgb,var(--k) 8%,#0b1230));cursor:pointer;font-size:2.1rem;color:color-mix(in srgb,var(--k) 70%,#fff);display:grid;place-items:center;transition:background .1s,box-shadow .1s,transform .1s;position:relative}
.pad-b .kbd{position:absolute;top:10px;left:10px}
.pad-b.lit{background:var(--k);color:#0b1230;box-shadow:0 0 50px var(--k),inset 0 0 30px rgba(255,255,255,.5);transform:scale(1.03)}
.pad-b.single{grid-column:span 2;aspect-ratio:2.6}
.pads.locked .pad-b{cursor:default}
.beat-row{display:flex;gap:6px;justify-content:center;min-height:16px}
.beat-row i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);transition:background .15s,box-shadow .15s}
.beat-row i.on{background:var(--cosmic);box-shadow:0 0 10px var(--cosmic)}
.sw-rule{display:inline-flex;align-items:center;gap:.6rem;padding:.65rem 1.2rem;border-radius:16px;font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:1.1rem;background:color-mix(in srgb,var(--rc) 20%,transparent);border:1px solid var(--rc);color:#fff;box-shadow:0 0 28px -6px var(--rc)}
.sw-rule.flash{animation:ruleFlash 1.1s}
.sw-card{width:clamp(130px,30vw,170px);aspect-ratio:3/4;border-radius:20px;background:linear-gradient(160deg,#f4f7ff,#cfd8f7);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:.9rem;box-shadow:0 22px 44px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.4) inset;animation:cardIn .25s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateY(-18px) rotate(-4deg)}to{opacity:1;transform:none}}
.sw-card svg{width:40%;height:auto}
.sw-piles{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;width:100%;max-width:640px}

.sw-pile.right{border-color:var(--ok);box-shadow:0 0 26px rgba(61,220,132,.7)}
.sw-pile.wrong{border-color:var(--bad);box-shadow:0 0 26px rgba(255,84,112,.7)}
.sw-cn{width:100%;text-align:center;font-size:.62rem;font-weight:700;color:#0b1230;letter-spacing:.06em}

/* ---------- 9 · ESTADÍSTICAS ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
.chart{width:100%;height:auto;display:block;overflow:visible}

.chart .hit:hover,.chart .hit:focus{fill:rgba(255,255,255,.07);outline:none}

.insight{display:flex;gap:.8rem;padding:.9rem;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:.6rem}

.insight p{font-size:var(--t-md)}
.cmp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
@media (max-width:640px){.cmp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmp{padding:.8rem;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--line)}

.cmp b{font-family:var(--display);font-size:1.3rem}
.cmp span{display:block;font-size:var(--t-xs);color:var(--dim)}

/* ---------- 10 · LOGROS / HISTORIAL ---------- */
.astro-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(ellipse at 50% 55%,rgba(155,109,255,.14),transparent 70%),radial-gradient(ellipse at 20% 20%,rgba(83,140,255,.1),transparent 60%),rgba(3,5,14,.7);border:1px solid var(--line)}

.astro-info{position:absolute;left:1rem;bottom:1rem;right:1rem;max-width:380px;padding:.8rem 1rem;border-radius:16px;background:rgba(6,9,22,.9);border:1px solid var(--line-3);font-size:var(--t-sm);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:.9rem}

.hist-item .hi-t{flex:1;min-width:0}

.hist-item .hi-v b{display:block;font-family:var(--display);font-size:var(--t-lg);color:var(--text)}

/* ---------- 11 · OVERLAYS ---------- */
.modal-bg{position:fixed;inset:0;z-index:128;display:grid;place-items:center;padding:1.1rem;background:rgba(3,5,14,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadeIn .2s}

.toasts{position:fixed;top:1rem;right:1rem;z-index:130;display:flex;flex-direction:column;gap:.7rem;pointer-events:none;max-width:min(390px,calc(100vw - 2rem))}

@keyframes toastScan{to{transform:translateX(110%)}}

@keyframes badgeIn{from{transform:scale(0) rotate(-180deg)}}
.lvlup{position:fixed;inset:0;z-index:140;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(83,140,255,.34),rgba(3,5,14,.94) 62%);animation:fadeIn .3s;padding:1.2rem;text-align:center;overflow:hidden}

.iris{position:fixed;inset:0;z-index:145;pointer-events:none}
.onb{position:fixed;inset:0;z-index:125;overflow:auto;background:radial-gradient(900px 600px at 50% 0%,rgba(83,140,255,.25),transparent 70%),rgba(5,8,19,.97);display:flex;align-items:center;justify-content:center;padding:1.2rem}

.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}

.goal.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px var(--c) inset,0 0 26px -10px var(--c)}
@media (max-width:520px){.goal-grid{grid-template-columns:minmax(0,1fr)}.onb-actions{flex-direction:column-reverse;align-items:stretch;gap:.5rem}.onb-actions>.btn,.onb-actions .onb-final{width:100%}.onb-actions .onb-final{flex-direction:column-reverse;align-items:stretch}.onb-actions .onb-final .btn{width:100%}.onb-box{padding:1.4rem}}

@media (max-width:520px){.how{grid-template-columns:minmax(0,1fr)}}

.tour-tip p{font-size:var(--t-md);margin:.4rem 0 .8rem}
/* resumen de misión */
.sum-hero{position:relative;text-align:center;padding:1.8rem 1.2rem 1.6rem;overflow:hidden;--c:var(--teal)}
.sum-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(500px 280px at 50% 0%,rgba(83,140,255,.22),transparent 70%);pointer-events:none}

.xp-trans{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:17px;background:rgba(53,230,223,.07);border:1px solid rgba(53,230,223,.28);animation:rise .5s var(--ease)}

function lvlCalc(xp,base,inc){let L=1,need=base;xp=Math.max(0,xp|0);while(xp>=need){xp-=need;L++;need=base+inc*(L-1)}return {level:L,into:xp,need,pct:xp/need}}

function streak(){
  const keys=Object.keys(S.days).filter(k=>S.days[k].acts>0).sort();
  if(!keys.length)return {current:0,best:0,total:0,trainedToday:false,last:null};
  let best=1,run=1;
  for(let i=1;i<keys.length;i++){const g=daysBetween(keys[i-1],keys[i]);run=g<=2?run+1:1;best=Math.max(best,run)}
  const t=today(),gap=daysBetween(keys.at(-1),t);
  return {current:gap<=2?run:0,best,total:keys.length,trainedToday:keys.at(-1)===t,last:keys.at(-1),atRisk:gap===2}
}

function logAdapt(game,dir,level,why){S.adaptLog.push({ts:Date.now(),game,dir,level,why});if(S.adaptLog.length>120)S.adaptLog.shift()}
function adaptAfter(gid,level,acc,info){
  const d=GAMES[gid],g=gs(gid),up=d.adapt?.up??.85,down=d.adapt?.down??.55,max=d.maxLevel;
  if(info.anomaly)return {dir:null,text:`Desafío sorpresa jugado en el nivel ${level}: no modifica tu nivel recomendado (${g.level}).`};
  if(info.partial)return {dir:null,text:'Partida interrumpida: no se usa para ajustar la dificultad.'};
  if(level!==g.level)return {dir:null,text:`Elegiste el nivel ${level} manualmente. Neuro AI solo ajusta tu nivel recomendado (${g.level}) con las partidas jugadas en ese nivel.`};
  g.recent.push(+acc.toFixed(3));if(g.recent.length>6)g.recent.shift();
  const r=g.recent;
  if(r.length>=3&&r.slice(-3).every(a=>a>=up)){
    if(g.level<max){g.level++;g.recent=[];logAdapt(gid,'up',g.level,`3 rondas seguidas con ≥ ${pct(up)}`);return {dir:'up',text:`3 rondas seguidas con precisión ≥ ${pct(up)} en el nivel ${level}. Subo tu nivel recomendado a <b>${g.level}</b>.`}}
    return {dir:null,text:`Dominas el nivel máximo (${max}) con constancia. ¡Impresionante!`}}
  if(r.length>=2&&r.slice(-2).every(a=>a<down)){
    if(g.level>1){g.level--;g.recent=[];logAdapt(gid,'down',g.level,`2 rondas con < ${pct(down)}`);return {dir:'down',text:`2 rondas seguidas con precisión < ${pct(down)}. Bajo un nivel (al <b>${g.level}</b>) para priorizar la precisión: volverás a subir cuando la consolides.`}}
    return {dir:null,text:'Estás en el nivel inicial. Tómate tu tiempo: aquí la precisión importa más que la velocidad.'}}
  let k=0;for(let i=r.length-1;i>=0&&r[i]>=up;i--)k++;
  if(acc>=up)return {dir:null,text:`Precisión alta (${pct(acc)}). Llevas ${k} de 3 rondas ≥ ${pct(up)} para subir de nivel.`};
  if(acc<down)return {dir:null,text:`Precisión baja (${pct(acc)}). Si se repite en la próxima ronda bajaré un nivel para que consolides.`};
  return {dir:null,text:`Precisión de ${pct(acc)}, entre los umbrales (${pct(down)}–${pct(up)}). Mantengo el nivel ${g.level} y varío los retos.`}
}
function recordResult(gid,r,info){

  if(info.anomaly){parts.push(['Anomalía ×2',xp]);xp*=2}
  const prevEq=[...S.results].reverse().find(x=>x.game===gid&&x.mode===(info.mode||'std')&&x.level===info.level);
  const mk=info.mode||'std',best=g.best[mk]||(g.best[mk]={}),pbs=[];

  if(!info.partial){
    if(r.score!=null){if(best.score==null){best.score=r.score;best.lv=info.level}else if(better(r.score,best.score)){pbs.push({k:'score',label:d.metric.label,prev:best.score,val:r.score});best.score=r.score;best.lv=info.level}}

  }
  const res={id:uid(),game:gid,skill:d.skill,ts:Date.now(),date,dur:Math.max(1,Math.round(info.durSec)),level:info.level,mode:mk,acc:+acc.toFixed(4),score:r.score??null,correct:r.correct||0,wrong:r.wrong||0,total:r.total||0,rt:r.rt?Math.round(r.rt):null,xp,daily:!!info.daily,session:info.session||null,anomaly:!!info.anomaly,extra:{...(r.extra||{}),...(info.partial?{partial:true}:{})},pb:pbs.map(p=>p.k),pbd:pbs,opts:info.opts||{}};
  const adapt=adaptAfter(gid,info.level,acc,info);res.adapt=adapt.dir;
  S.results.push(res);if(S.results.length>4000)S.results.splice(0,S.results.length-4000);

  S.xp+=xp;S.skillXp[d.skill]=(S.skillXp[d.skill]||0)+xp;
  const day=S.days[date]||(S.days[date]={sec:0,acts:0,xp:0,accSum:0});day.sec+=res.dur;day.acts++;day.xp+=xp;day.accSum+=acc;
  S.stats.totalSec+=res.dur;S.stats.activities++;

  UI.pendingWave=d.skill;

}

/* ---------- Contadores animados (la cifra final es siempre la real) ---------- */
function countUp(root=document){
  $$('[data-count]',root).forEach(el=>{
    const to=+el.dataset.count,dec=+(el.dataset.dec||0),dur=+(el.dataset.dur||950);
    const fmt=v=>dec?v.toFixed(dec).replace('.',','):Math.round(v).toLocaleString('es');
    el.textContent=fmt(to);
    if(RM()||!isFinite(to)||Math.abs(to)<2)return;
    const t0=performance.now();let fin=false;
    const step=t=>{if(fin||!el.isConnected)return;const p=Math.min(1,(t-t0)/dur);el.textContent=fmt(to*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(step)};
    el.textContent=fmt(0);requestAnimationFrame(step);
    setTimeout(()=>{fin=true;el.textContent=fmt(to)},dur+250);
  });
}

 init(){

/* ---------- Transición tipo iris: el color del mundo se expande ---------- */
const Transition={busy:false,
 iris(color,x,y,cb){
  if(RM()||!document.body.animate||this.busy){cb();return}
  this.busy=true;
  x=x??innerWidth/2;y=y??innerHeight/2;
  const el=document.createElement('div');el.className='iris';
  el.style.background=`radial-gradient(circle at ${x}px ${y}px,${color} 0%,color-mix(in srgb,${color} 42%,#060913) 52%,#060913 100%)`;
  document.body.appendChild(el);
  const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+20;
  const a=el.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(${R}px at ${x}px ${y}px)`}],{duration:300,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
  let done=false;
  const fin=()=>{if(done)return;done=true;try{cb()}catch(e){console.error(e)}
    const b=el.animate([{opacity:1},{opacity:0}],{duration:320,easing:'ease-out',fill:'forwards'});
    const rm=()=>{el.remove();this.busy=false};b.onfinish=rm;setTimeout(rm,800)};
  a.onfinish=fin;setTimeout(fin,420);
 }
};

function todayPlan(minutes,skills){
  if(S.today.date!==today())S.today={date:today(),variant:0,minutes:0,plan:null,key:''};
  const key=`${today()}|${minutes}|${S.today.variant}|${(skills||[]).join(',')}|${S.settings.noSpeed?1:0}|${S.profile.goal}`;
  if(S.today.key!==key||!S.today.plan){S.today.key=key;S.today.minutes=minutes;S.today.plan=Daily.buildPlan(minutes,{skills,variant:S.today.variant});save()}
  return S.today.plan
}

function radarSVG(){const compact=innerWidth<640;
  const cx=230,cy=215,R=145,n=SKILLS.length,pts=SKILLS.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return {s,a,v:skillPerf(s.id)}});
  const P=(a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r];
  let o=`<svg class="chart" viewBox="0 0 460 440" role="img" aria-label="Radar de rendimiento por habilidad"><defs><radialGradient id="rdg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9B6DFF" stop-opacity=".5"/><stop offset="1" stop-color="#538CFF" stop-opacity=".12"/></radialGradient></defs>`;
  [25,50,75,100].forEach(k=>{o+=`<polygon points="${pts.map(p=>P(p.a,R*k/100).join(',')).join(' ')}" fill="none" stroke="rgba(150,175,255,${k===100?.28:.12})"/>`});
  pts.forEach(p=>{const[x,y]=P(p.a,R);o+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(150,175,255,.15)"/>`});
  if(pts.some(p=>p.v!=null))o+=`<g class="rpoly"><polygon class="glow" style="color:#538CFF" points="${pts.map(p=>P(p.a,R*(p.v||0)/100).join(',')).join(' ')}" fill="url(#rdg)" stroke="#6F9BFF" stroke-width="2.2" stroke-linejoin="round"/></g>`;
  pts.forEach(p=>{const[lx,ly]=P(p.a,R+34),anchor=Math.abs(Math.cos(p.a))<.2?'middle':Math.cos(p.a)>0?'start':'end',rs=S.results.filter(r=>r.skill===p.s.id);
    const tip=`<b>${p.s.short}</b>${p.v!=null?`Índice ${p.v}/100 · nivel ${skillLvl(p.s.id).level}<br>${rs.length} actividades · precisión reciente ${pct(avg(rs.slice(-15).map(r=>r.acc)))}`:'Aún sin datos: juega este mundo para dibujar su eje.'}`;
    if(p.v!=null){const[x,y]=P(p.a,R*p.v/100);o+=`<circle class="glow" style="color:${p.s.color}" cx="${x}" cy="${y}" r="5.5" fill="${p.s.color}" stroke="#060913" stroke-width="2"/>`}
    else{const[x,y]=P(p.a,18);o+=`<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="${p.s.color}" stroke-dasharray="2 2"/>`}
    o+=compact?`<svg x="${lx-15}" y="${ly-26}" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${p.s.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[p.s.icon][0]==='M'?`<path d="${IC[p.s.icon]}"/>`:IC[p.s.icon]}</svg><text x="${lx}" y="${ly+16}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:${p.s.color}">${p.v!=null?p.v:'–'}</text>`:`<text x="${lx}" y="${ly}" text-anchor="${anchor}" style="font-size:13px;font-weight:700;fill:${p.s.color}">${p.s.short}</text><text x="${lx}" y="${ly+15}" text-anchor="${anchor}" style="font-size:11.5px">${p.v!=null?p.v+'/100':'sin datos'}</text>`;
    const[hx,hy]=P(p.a,R*.8);o+=`<circle class="hit" cx="${hx}" cy="${hy}" r="42" tabindex="0" aria-label="${p.s.short}" data-tip="${esc(tip)}"/>`});
  return o+'</svg>'
}
function evoSVG(nd){
  const keys=Array.from({length:nd},(_,i)=>addDays(today(),i-nd+1));
  const data=keys.map(k=>{const rs=S.results.filter(r=>r.date===k);return {k,min:sum(rs.map(r=>r.dur))/60,acc:rs.length?avg(rs.map(r=>r.acc)):null,n:rs.length,xp:sum(rs.map(r=>r.xp))}});
  const mob=innerWidth<=900,W=mob?Math.max(280,Math.min(700,innerWidth-84)):760,H=mob?230:260,pl=mob?30:40,pr=mob?36:44,pt=18,pb=32,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(10,Math.ceil(Math.max(...data.map(d=>d.min))/5)*5),bw=iw/nd;
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos y precisión por día, últimos ${nd} días"><defs><linearGradient id="evb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35E6DF" stop-opacity=".8"/><stop offset="1" stop-color="#538CFF" stop-opacity=".25"/></linearGradient><linearGradient id="eva" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9B6DFF" stop-opacity=".32"/><stop offset="1" stop-color="#9B6DFF" stop-opacity="0"/></linearGradient></defs>`;
  [0,.5,1].forEach(f=>{const y=pt+ih*(1-f);o+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(150,175,255,.1)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(mx*f)}′</text><text x="${W-pr+6}" y="${y+4}">${Math.round(f*100)}%</text>`});
  data.forEach((d,i)=>{const x=pl+i*bw,h=d.min/mx*ih;if(d.min>0)o+=`<rect x="${(x+bw*.2).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${Math.max(2,h).toFixed(1)}" rx="3" fill="url(#evb)"/>`;const every=nd>10?Math.ceil(nd/8):1;if(i%every===0||i===nd-1)o+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle">${nd>10?parseKey(d.k).getDate():parseKey(d.k).toLocaleDateString('es',{weekday:'short'})}</text>`});
  let seg=[];const flush=()=>{if(seg.length>1){const pts=seg.map(s=>s.join(',')).join(' '),first=seg[0],last=seg.at(-1);o+=`<polygon points="${first[0]},${pt+ih} ${pts} ${last[0]},${pt+ih}" fill="url(#eva)"/><polyline class="glow draw" style="color:#9B6DFF" pathLength="1000" points="${pts}" fill="none" stroke="#9B6DFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`}seg=[]};
  data.forEach((d,i)=>{if(d.acc==null){flush();return}seg.push([+(pl+i*bw+bw/2).toFixed(1),+(pt+ih*(1-d.acc)).toFixed(1)])});flush();
  data.forEach((d,i)=>{if(d.acc!=null){const x=pl+i*bw+bw/2,y=pt+ih*(1-d.acc);o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="#9B6DFF" stroke="#060913" stroke-width="1.5"/>`}});
  data.forEach((d,i)=>{const x=pl+i*bw,tip=`<b>${esc(fmtDate(d.k))}</b>${d.n?`${Math.round(d.min)} min · ${d.n} ${d.n===1?'actividad':'actividades'}<br>Precisión media ${pct(d.acc)} · +${d.xp} XP`:'Sin entrenamiento'}`;o+=`<rect class="hit" x="${x.toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${ih}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(fmtDate(d.k))}"/>`});
  return o+'</svg>'
}

function insights(){
  const out=[],R=S.results;
  const b={Mañana:[],Tarde:[],Noche:[]};R.forEach(r=>{const h=new Date(r.ts).getHours();(h>=5&&h<12?b.Mañana:h<19&&h>=12?b.Tarde:b.Noche).push(r.acc)});
  const ok=Object.entries(b).filter(([,v])=>v.length>=3);
  if(ok.length>=2){const s=ok.map(([k,v])=>[k,avg(v),v.length]).sort((a,b)=>b[1]-a[1]);out.push(`<div class="insight">${ic('sun')}<p>Tu mejor franja horaria es la <b>${s[0][0].toLowerCase()}</b>: ${pct(s[0][1])} de precisión media (${s[0][2]} actividades) frente a ${pct(s.at(-1)[1])} por la ${s.at(-1)[0].toLowerCase()}.</p></div>`)}
  else out.push(`<div class="insight">${ic('sun')}<p>Cuando tengas al menos 3 actividades en dos franjas del día (mañana, tarde o noche) te mostraré en cuál rindes mejor.</p></div>`);
  const en={};S.sessions.filter(s=>s.energy&&s.activities.length).forEach(s=>{(en[s.energy]||(en[s.energy]=[])).push(avg(s.activities.map(a=>a.acc)))});
  const ek=Object.entries(en).filter(([,v])=>v.length>=2);const names={1:'baja',2:'media',3:'alta'};
  if(ek.length>=2){const s=ek.map(([k,v])=>[names[k],avg(v),v.length]).sort((a,b)=>b[1]-a[1]);out.push(`<div class="insight">${ic('bolt')}<p>Los días que reportas energía <b>${s[0][0]}</b> tu precisión media es ${pct(s[0][1])}; con energía ${s.at(-1)[0]}, ${pct(s.at(-1)[1])}. Es una correlación en tus datos, no una causa demostrada.</p></div>`)}
  else out.push(`<div class="insight">${ic('bolt')}<p>Indica tu energía antes de la misión diaria. Con 2 sesiones en al menos dos niveles de energía, verás cómo se relaciona con tus resultados.</p></div>`);
  const ups=S.adaptLog.filter(e=>e.dir==='up').length,downs=S.adaptLog.filter(e=>e.dir==='down').length;
  out.push(`<div class="insight">${ic('trend')}<p>Ajustes de dificultad registrados: <b>${ups}</b> subidas y <b>${downs}</b> bajadas de nivel, siempre según las reglas de precisión de Neuro AI.</p></div>`);
  return out.join('')
}

function astroPos(){const N=ACH.length,pt=innerWidth<640;return ACH.map((a,i)=>{const r=seeded('astro'+a.id),ang=i*2.399963+.6,rad=Math.sqrt((i+.8)/N);return pt?[260+Math.cos(ang)*rad*215+(r()-.5)*22,260+Math.sin(ang)*rad*215+(r()-.5)*22]:[450+Math.cos(ang)*rad*390+(r()-.5)*26,225+Math.sin(ang)*rad*175+(r()-.5)*18]})}
function astroSVG(){const pt=innerWidth<640,VW=pt?520:900,VH=pt?520:450;
  const pos=astroPos(),unl=ACH.map((a,i)=>({a,i,ts:S.achievements[a.id]})).filter(x=>x.ts).sort((x,y)=>x.ts-y.ts);
  let o=`<svg class="astro-svg" viewBox="0 0 ${VW} ${VH}" role="group" aria-label="Constelación de logros: ${unl.length} de ${ACH.length} estrellas encendidas"><defs>${ACH.map(a=>`<radialGradient id="ag-${a.id}"><stop offset="0" stop-color="${a.c}" stop-opacity=".7"/><stop offset="1" stop-color="${a.c}" stop-opacity="0"/></radialGradient>`).join('')}</defs>`;
  const sr=seeded('astrobg');for(let i=0;i<90;i++)o+=`<circle cx="${(sr()*VW).toFixed(0)}" cy="${(sr()*VH).toFixed(0)}" r="${(sr()*1.2+.25).toFixed(1)}" fill="#EDF5FF" opacity="${(sr()*.45+.08).toFixed(2)}"/>`;
  if(unl.length>1)o+=`<polyline points="${unl.map(u=>pos[u.i].map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(120,170,255,.45)" stroke-width="1.3" stroke-dasharray="4 5" stroke-linejoin="round"/>`;
  ACH.forEach((a,i)=>{const[x,y]=pos[i],on=!!S.achievements[a.id];
    o+=`<g class="astro-star" tabindex="0" role="button" data-ach="${a.id}" aria-label="${esc(a.name)}: ${on?'desbloqueado':'bloqueado'}">${on?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="26" fill="url(#ag-${a.id})"/><path class="tw" style="animation-delay:${(i%7)*.5}s" d="M${x.toFixed(1)} ${(y-11).toFixed(1)}L${(x+3).toFixed(1)} ${(y-3).toFixed(1)}L${(x+11).toFixed(1)} ${y.toFixed(1)}L${(x+3).toFixed(1)} ${(y+3).toFixed(1)}L${x.toFixed(1)} ${(y+11).toFixed(1)}L${(x-3).toFixed(1)} ${(y+3).toFixed(1)}L${(x-11).toFixed(1)} ${y.toFixed(1)}L${(x-3).toFixed(1)} ${(y-3).toFixed(1)}Z" fill="${a.c}" stroke="#fff" stroke-width=".8"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#fff"/>`:`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="none" stroke="rgba(150,170,220,.5)" stroke-width="1.2"/>`}<circle class="fr" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${pt?34:22}" fill="transparent" stroke="none"/></g>`});
  return o+'</svg>'
}

class Clock{
  constructor(){this.paused=false;this.ps=0;this.pt=0;this.timers=new Set();this.dead=false}
  now(){return (this.paused?this.ps:performance.now())-this.pt}
  after(ms,fn){const t={fn,due:this.now()+ms,id:null};this.timers.add(t);if(!this.paused)this._arm(t);return t}
  _arm(t){clearTimeout(t.id);t.id=setTimeout(()=>{if(this.dead||this.paused)return;this.timers.delete(t);t.fn()},Math.max(0,t.due-this.now()))}
  cancel(t){if(!t)return;clearTimeout(t.id);this.timers.delete(t)}
  /* bucle de animación pausable; si requestAnimationFrame se ralentiza o se detiene, un temporizador de respaldo mantiene el juego en marcha */
  loop(fn){const L={stop:false,last:null,ran:0};
    const body=()=>{if(L.stop||this.dead){clearInterval(L.iv);return false}if(!this.paused){const n=this.now(),dt=L.last==null?0:Math.min(100,n-L.last);L.last=n;try{fn(dt,n)}catch(e){console.error(e);L.stop=true}}L.ran=performance.now();return true};
    const step=()=>{if(body())requestAnimationFrame(step)};requestAnimationFrame(step);
    L.iv=setInterval(()=>{if(performance.now()-L.ran>150)body()},100);
    L.cancel=()=>{L.stop=true;clearInterval(L.iv)};return L}
  pause(){if(this.paused||this.dead)return;this.paused=true;this.ps=performance.now();this.timers.forEach(t=>clearTimeout(t.id))}
  resume(){if(!this.paused||this.dead)return;this.pt+=performance.now()-this.ps;this.paused=false;this.timers.forEach(t=>this._arm(t))}
  destroy(){this.dead=true;this.timers.forEach(t=>clearTimeout(t.id));this.timers.clear()}
}

const Daily={run:null,
 buildPlan(minutes,{skills=null,variant=0}={}){
  const rng=seeded(`plan|${today()}|${minutes}|${variant}|${(skills||[]).join('')}`),goal=GOALS[S.profile.goal]||GOALS.balanced,noSpeed=S.settings.noSpeed,t=today();
  const allowed=g=>GAMES[g].daily&&!(noSpeed&&GAMES[g].speed&&!GAMES[g].daily.slowMode);
  let pool=SKILLS.filter(s=>(!skills||skills.includes(s.id))&&s.games.some(allowed));
  if(!pool.length)pool=SKILLS.filter(s=>s.games.some(allowed));
  const pr=pool.map(s=>{const lp=lastPlayed(s.id),days=lp?daysBetween(dkey(new Date(lp)),t):30,wk=sum(S.results.filter(r=>r.skill===s.id&&Date.now()-r.ts<7*864e5).map(r=>r.dur)),isGoal=goal.skills.includes(s.id);
    const p=Math.min(days,10)*1.2+3/(1+wk/120)+(isGoal?2.5:0)+rng()*1.6;
    const why=!lp?'aún sin explorar':days>=3?`sin práctica desde hace ${days} días`:isGoal?'tu objetivo principal':wk<240?'poca práctica esta semana':'mantener el equilibrio';
    return {s,p,why}}).sort((a,b)=>b.p-a.p);
  let n=skills?clamp(Math.round(minutes/2.2),2,10):minutes<=6?3:minutes<=18?7:9;
  n=Math.min(n,pool.length*2,10);
  const chosen=Array.from({length:n},(_,i)=>pr[i%pr.length]);
  const used=new Set(),tie={};Object.keys(GAMES).forEach(g=>tie[g]=rng());
  const items=chosen.map(({s,why})=>{let gl=s.games.filter(g=>allowed(g)&&!used.has(g));if(!gl.length)gl=s.games.filter(allowed);gl.sort((a,b)=>((S.games[a]?.last||0)-(S.games[b]?.last||0))||(tie[a]-tie[b]));const g=gl[0];used.add(g);const it={game:g,why};if(noSpeed&&GAMES[g].speed)it.mode=GAMES[g].daily.slowMode;return it});
  const total=minutes*60,base=items.map(it=>clamp(total/items.length,GAMES[it.game].daily.min||60,GAMES[it.game].daily.max||240)),k=total/sum(base);
  items.forEach((it,i)=>{const dd=GAMES[it.game].daily;it.budget=Math.round(clamp(base[i]*k,dd.min||60,(dd.max||240)*1.25)/5)*5});
  return items
 },

 begin(plan,meta={}){
  if(!plan||!plan.length)return;
  this.run={id:uid(),ts:Date.now(),date:today(),plan:plan.map(p=>({...p})),idx:0,st:[],done:[],skipped:[],outs:[],type:meta.type||'daily',minutes:meta.minutes||Math.round(sum(plan.map(p=>p.budget))/60),energy:meta.energy||null,hits:0,exited:false,name:meta.name||missionName(),xp0:S.xp};
  Play.showShell();this.showStep(null);

  const r=this.run;if(!r){Play.close();return}
  const it=r.plan[r.idx];
  if(out){r.done.push({game:it.game,res:out.res,xp:out.xp,dur:out.res.dur,budget:it.budget,prevEq:out.prevEq,partial:info.reason==='exit'});r.outs.push(out);r.hits+=out.res.correct;r.st[r.idx]='done'}

  let v='';const disp=$('.kp-display',box),val=$('.kp-val',box);let off=false;
  const api={get value(){return v},clear(){v='';val.textContent=''},
   flash(ok){disp.classList.remove('ok','bad');void disp.offsetWidth;disp.classList.add(ok?'ok':'bad');setTimeout(()=>disp.classList.remove('ok','bad'),450)},
   show(t){val.textContent=t},

const INK=[{name:'ROJO',hex:'#FF4D5E',sym:'●'},{name:'AZUL',hex:'#538CFF',sym:'■'},{name:'VERDE',hex:'#3DDC84',sym:'▲'},{name:'AMARILLO',hex:'#FFD23F',sym:'★'}];
const stLim=L=>3200-(L-1)*230,stInc=L=>.5+(L-1)*.045;

const HCOL=[{hex:'#538CFF',m:'azul',mp:'azules',f:'azul',fp:'azules',L:'A'},{hex:'#FF65C7',m:'rosa',mp:'rosas',f:'rosa',fp:'rosas',L:'R'},{hex:'#FFD23F',m:'amarillo',mp:'amarillos',f:'amarilla',fp:'amarillas',L:'M'},{hex:'#3DDC84',m:'verde',mp:'verdes',f:'verde',fp:'verdes',L:'V'}];
const HSN={circle:['círculo','círculos',0],square:['cuadrado','cuadrados',0],triangle:['triángulo','triángulos',0],star:['estrella','estrellas',1],diamond:['rombo','rombos',0]};
function hRule(r){const up=s=>`<b>${s.toUpperCase()}</b>`;
 if(r.t==='color')return `todo lo de color ${up(r.c.m)}`;
 if(r.t==='shape')return `solo ${HSN[r.s][2]?'las':'los'} ${up(HSN[r.s][1])}`;
 if(r.t==='both'){const f=HSN[r.s][2];return `solo ${f?'las':'los'} ${up(HSN[r.s][1]+' '+(f?r.c.fp:r.c.mp))}`}
 return `todo lo que ${up('no')} sea de color ${up(r.c.m)}`}
const hMatch=(r,it)=>r.t==='color'?it.c===r.c:r.t==='shape'?it.s===r.s:r.t==='both'?it.s===r.s&&it.c===r.c:it.c!==r.c;
reg({id:'hunt',skill:'attention',name:'Caza de estímulos',icon:'hunt',tagline:'Atrapa solo lo que cumple la regla.',
 howTo:['Aparecerán figuras de colores moviéndose por la pantalla.','Toca únicamente las que cumplan la regla indicada arriba (por ejemplo, «solo los círculos azules»).','En niveles avanzados la regla cambia durante la partida: siempre se anuncia antes.'],
 maxLevel:10,metric:{label:'Aciertos',better:'high'},speed:true,daily:{min:45,max:120},
 levelInfo:L=>`Hasta ${3+Math.ceil(L/2)} figuras a la vez · ${L<=2?'reglas simples':L<=5?'reglas de forma y color':'reglas con negación'}${L>=4?' · la regla cambia durante la partida':''}`,
 start(ctx){
  const L=ctx.level,dur=ctx.budget||45000,maxOn=3+Math.ceil(L/2),speed=32+L*11,life=3800-L*180,spawnEvery=950-L*45,size=Math.round(72-L*2.4),assist=S.settings.colorAssist;
  const types=L<=2?['color','shape']:L<=5?['both','color','shape','both']:['both','not','shape','both'],changes=L>=4,changeEvery=L>=8?11000:L>=6?14000:17000;
  ctx.stage.innerHTML=`<div class="hunt"><div class="rule-bar" id="hrule" aria-live="polite"></div><div class="arena" id="harena" aria-label="Zona de juego"></div><p class="hint" style="margin:0">Toca solo los objetivos. Los fallos y los objetivos que se escapan restan precisión.</p></div>`;
  const arena=$('#harena'),ruleEl=$('#hrule');let W=0,H=0;const measure=()=>{const r=arena.getBoundingClientRect();W=r.width;H=r.height};measure();ctx.on(window,'resize',measure);
  const st={hit:0,miss:0,fa:0,rules:0,rts:[]};let items=[],rule=null,frozen=0,lastSpawn=-1e9,lastChange=0;
  const place=it=>{it.el.style.transform=`translate(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px)`};
  function newRule(){let r;do{r={t:pick(types),c:pick(HCOL),s:pick(HSH)}}while(rule&&rule.t===r.t&&rule.c===r.c&&rule.s===r.s);rule=r;st.rules++;
    ruleEl.innerHTML=`${st.rules>1?'<span class="eyebrow" style="color:var(--pink)">Nueva regla · </span>':''}Toca ${hRule(r)}`;
    if(st.rules>1){items.forEach(it=>it.el.remove());items=[];ruleEl.classList.remove('flash');void ruleEl.offsetWidth;ruleEl.classList.add('flash');Sound.alert();ctx.say('Cambio de regla');
      const b=document.createElement('div');b.className='arena-banner';b.innerHTML=`<div><b>¡CAMBIO DE REGLA!</b>Ahora toca ${hRule(r)}</div>`;arena.appendChild(b);frozen=ctx.clock.now()+1900;ctx.clock.after(1900,()=>b.remove())}}
  function make(target){for(let k=0;k<80;k++){let c=pick(HCOL),s=pick(HSH);
    if(target){if(rule.t==='color')c=rule.c;else if(rule.t==='shape')s=rule.s;else if(rule.t==='both'){c=rule.c;s=rule.s}}
    else if(rule.t==='both'&&L>=3&&Math.random()<.7){if(Math.random()<.5)s=rule.s;else c=rule.c}

  function spawn(now){const it=make(Math.random()<.42);it.target=hMatch(rule,it);const a=rnd(0,Math.PI*2);it.x=rnd(0,Math.max(1,W-size));it.y=rnd(0,Math.max(1,H-size));it.vx=Math.cos(a)*speed;it.vy=Math.sin(a)*speed;it.born=now;
    const el=document.createElement('button');el.className='hitem';el.style.width=el.style.height=size+'px';el.setAttribute('aria-label',`${HSN[it.s][0]} ${HSN[it.s][2]?it.c.f:it.c.m}`);
    el.innerHTML=shapeSVG(it.s,it.c.hex,{extra:assist?`<text x="50" y="63" text-anchor="middle" font-size="34" font-weight="800" fill="#0B1230" font-family="sans-serif">${it.c.L}</text>`:''});
    it.el=el;place(it);arena.appendChild(el);items.push(it);
    el.addEventListener('pointerdown',e=>{e.preventDefault();tap(it)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(it)}})}
  function remove(it,filter){items=items.filter(x=>x!==it);if(filter)it.el.style.filter=filter;it.el.classList.add('gone');setTimeout(()=>it.el.remove(),260)}

   details:`<h4>Atención selectiva y flexible</h4><p>Las falsas alarmas reflejan impulsividad (tocar lo que no cumple la regla) y los objetivos perdidos, lapsos de atención.${st.rules>1?` Tuviste ${st.rules-1} cambio(s) de regla, siempre anunciados.`:''}</p>`}}};
 }});

reg({id:'words',skill:'memory',name:'Memoria de palabras',icon:'words',tagline:'Memoriza una lista y escribe todas las que recuerdes.',
 howTo:['Memoriza la lista antes de que se oculte (puedes continuar antes con «Ya las memoricé»).','Escribe cada palabra que recuerdes y pulsa Enter o «Añadir». Toca una palabra escrita para borrarla.','En modo libre el orden no importa; en el secuencial, sí. Mayúsculas y tildes no cuentan.'],

 maxLevel:11,metric:{label:'Palabras',better:'high'},daily:{mode:'free',min:100,max:170},
 levelInfo:L=>`${Math.min(15,4+L)} palabras · ${(2.6-(L-1)*.1).toFixed(1)} s por palabra para memorizar`,
 start(ctx){
  const L=ctx.level,n=Math.min(15,4+L),seq=ctx.mode==='seq',memoMs=Math.round(n*(2600-(L-1)*100));
  let recallMs=(40+n*4)*1000;if(ctx.budget)recallMs=Math.max(30000,Math.min(recallMs,ctx.budget-memoMs-3000));
  const banks=Object.keys(WORDBANKS),single=Math.random()<.5,cat=single?pick(banks):'Mezcla';
  const seenL=new Set();let pool=(single?WORDBANKS[cat]:banks.flatMap(b=>WORDBANKS[b])).filter(w=>!w.includes(' ')&&w.length>=3&&w.length<=11).filter(w=>{const k=loose(w);if(seenL.has(k))return false;seenL.add(k);return true});

  const list=[];for(const w of shuffle(cand)){if(list.length>=n)break;if(list.some(x=>lev(loose(x),loose(w))<=2))continue;list.push(w)}
  S.recent.words=[...list.map(loose),...(S.recent.words||[])].slice(0,150);

  ctx.stage.innerHTML=`<div class="g-wrap"><div class="g-prompt">Memoriza ${seq?'<b>en orden</b> ':''}estas <b>${n}</b> palabras · categoría: <b>${cat}</b></div><div class="q-bar memo-timer"><i id="mbar"></i></div><div class="memo-grid">${list.map((w,i)=>`<div class="memo-w" style="animation-delay:${i*40}ms">${seq?`<small>${i+1}</small>`:''}${esc(w)}</div>`).join('')}</div><button class="btn btn-primary" id="mdone">${ic('check')} Ya las memoricé</button></div>`;

    ctx.stage.innerHTML=`<div class="g-wrap"><div class="g-prompt">Escribe las palabras que recuerdes${seq?' <b>en el mismo orden</b>':''}.</div><form class="recall-form" id="rform" autocomplete="off"><input class="input" id="rin" placeholder="Escribe una palabra…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="enter" aria-label="Palabra recordada"><button class="btn btn-primary" type="submit">Añadir</button></form><div class="chips" id="rchips" aria-live="polite"></div><div class="row"><span class="small muted" id="rcount">0 escritas</span><button class="btn" id="rend">${ic('check')} Terminar</button></div></div>`;

function sdPeers(n,br,bc){const P=[];for(let i=0;i<n*n;i++){const r=Math.floor(i/n),c=i%n,s=new Set();for(let k=0;k<n;k++){s.add(r*n+k);s.add(k*n+c)}const r0=Math.floor(r/br)*br,c0=Math.floor(c/bc)*bc;for(let a=0;a<br;a++)for(let b=0;b<bc;b++)s.add((r0+a)*n+c0+b);s.delete(i);P.push([...s])}return P}

  const fill=i=>{if(i===N)return true;for(const v of shuffle(cand(g,i))){g[i]=v;if(fill(i+1))return true}g[i]=0;return false};fill(0);
  const sol=g.slice();
  const count=(G,lim)=>{let bi=-1,bcand=null;for(let i=0;i<N;i++)if(!G[i]){const c=cand(G,i);if(!c.length)return 0;if(!bcand||c.length<bcand.length){bi=i;bcand=c;if(c.length===1)break}}if(bi<0)return 1;let t=0;for(const v of bcand){G[bi]=v;t+=count(G,lim-t);if(t>=lim)break}G[bi]=0;return t};

  return {puzzle:p,sol,P}
}

reg({id:'anagram',skill:'language',name:'Ordena las letras',icon:'anagram',tagline:'Reconstruye la palabra escondida.',
